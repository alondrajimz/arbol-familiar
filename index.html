/* ── helpers ── */
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function calcAge(birth,death){
  if(!birth)return null;
  const b=new Date(birth),d=death?new Date(death):new Date();
  if(isNaN(b))return null;
  let a=d.getFullYear()-b.getFullYear();
  if(d.getMonth()<b.getMonth()||(d.getMonth()===b.getMonth()&&d.getDate()<b.getDate()))a--;
  return a>=0?a:null;
}
function getDisplay(m){
  const first=m.firstName||(m.name?m.name.split(" ")[0]:"");
  const l1=m.lastName1||(m.name?m.name.split(" ")[1]||"":"");
  const l2=m.lastName2||(m.name?m.name.split(" ").slice(2).join(" "):"");
  return {first,last:([l1,l2].filter(Boolean).join(" ")),full:([first,l1,l2].filter(Boolean).join(" "))};
}
function parsePartners(p){if(!p)return[];if(Array.isArray(p))return p;return Object.values(p);}
const dateInputSupported=(()=>{try{const i=document.createElement("input");i.setAttribute("type","date");i.value="not-a-date";return i.value!=="not-a-date";}catch(e){return false;}})();

function timeAgo(iso){const s=(Date.now()-new Date(iso).getTime())/1000;if(s<60)return"ahora";if(s<3600)return`hace ${Math.floor(s/60)} min`;if(s<86400)return`hace ${Math.floor(s/3600)} h`;if(s<172800)return"ayer";return`hace ${Math.floor(s/86400)} días`;}
function pushLog(userId,action,targetId,targetName,details){logsRef.push({timestamp:new Date().toISOString(),userId:userId||null,action,targetId,targetName,details}).catch(()=>{});}

/* ── LAYOUT ALGORITHM ── */
function autoLayout(members){
  try{
  if(!members.length)return members;
  const m=members.map(x=>({...x}));
  const byId=Object.fromEntries(m.map(x=>[x.id,x]));

  // Step 1: gen 0 = roots, children = parent gen + 1
  const gen={};
  m.forEach(x=>{if(!x.parent1Id&&!x.parent2Id)gen[x.id]=0;});
  let chg=true,it=0;
  while(chg&&it++<100){chg=false;m.forEach(x=>{
    if(gen[x.id]!=null)return;
    const gs=[x.parent1Id,x.parent2Id].filter(Boolean).map(id=>gen[id]).filter(g=>g!=null);
    if(gs.length){gen[x.id]=Math.max(...gs)+1;chg=true;}
  });}
  m.forEach(x=>{if(gen[x.id]==null)gen[x.id]=0;});

  // Steps 2-4 in one outer loop until stable (max 100 passes)
  chg=true;it=0;
  const coupleForced=new Set();
  while(chg&&it++<100){
    chg=false;
    // Partners → same gen (always use the deeper/higher gen of the two)
    m.forEach(x=>parsePartners(x.partnerships).forEach(pr=>{
      const p=byId[pr.partnerId];if(!p||gen[p.id]==null)return;
      const targetGen=Math.max(gen[x.id],gen[p.id]);
      if(gen[x.id]!==targetGen){gen[x.id]=targetGen;chg=true;coupleForced.add(x.id);}
      if(gen[p.id]!==targetGen){gen[p.id]=targetGen;chg=true;coupleForced.add(p.id);}
    }));
    // Siblings → same gen (max = deepest sibling's row, keeps all on one row)
    const sibs={};
    m.forEach(x=>[x.parent1Id,x.parent2Id].filter(Boolean).forEach(pid=>{
      if(!sibs[pid])sibs[pid]=[];
      if(!sibs[pid].includes(x.id))sibs[pid].push(x.id);
    }));
    Object.values(sibs).forEach(ids=>{
      const parentGens=ids.map(id=>{const x=byId[id];const gs=[x.parent1Id,x.parent2Id].filter(Boolean).map(p=>gen[p]).filter(g=>g!=null);return gs.length?Math.max(...gs)+1:gen[id]??0;});
      const targetG=Math.max(...parentGens);
      ids.forEach(id=>{if((gen[id]??0)!==targetG){gen[id]=targetG;chg=true;}});
    });
    // Children strictly below every parent (skipped if partner rule already placed them)
    m.forEach(x=>{
      if(coupleForced.has(x.id))return;
      const gs=[x.parent1Id,x.parent2Id].filter(Boolean).map(id=>gen[id]).filter(g=>g!=null);
      if(!gs.length)return;
      const n=Math.max(...gs)+1;
      if((gen[x.id]??0)<n){gen[x.id]=n;chg=true;}
    });
  }

  const CG=130; // couple center-to-center (70px avatar + 60px gap)
  const MG=185; // min gap between node centers (card is 150px wide → 35px margin)
  const FG=260; // gap between different families
  const maxG=Math.max(...Object.values(gen),0);
  const posX={};

  // Build family key for each member: sorted parent ids
  function famKey(x){return[x.parent1Id||"",x.parent2Id||""].sort().join("|");}
  // Direct children of a specific person (not via their partner)
  function directKids(id){return m.filter(c=>c.parent1Id===id||c.parent2Id===id);}

  // X positions: bottom-up, generation by generation
  for(let g=maxG;g>=0;g--){
    const gms=m.filter(x=>gen[x.id]===g);

    // A) Group by family (same parents), sort each family by birthDate
    const famMap={};
    gms.forEach(x=>{
      const k=famKey(x);
      if(!famMap[k])famMap[k]=[];
      famMap[k].push(x);
    });
    Object.values(famMap).forEach(fam=>fam.sort((a,b)=>(a.birthDate||"").localeCompare(b.birthDate||"")));

    // Sort families by earliest birthDate in the family (applies to all generations)
    const famKeys=Object.keys(famMap).sort((ka,kb)=>{
      const aDate=famMap[ka].map(x=>x.birthDate||"9999").sort()[0];
      const bDate=famMap[kb].map(x=>x.birthDate||"9999").sort()[0];
      return aDate.localeCompare(bDate);
    });

    // For each family, build couple/single units
    function buildUnits(fam){
      const done=new Set();const units=[];
      // Pass 1: pair up casado couples only
      fam.forEach(x=>{
        if(done.has(x.id))return;
        const pr=parsePartners(x.partnerships)
          .filter(p=>p.type==="actual")
          .find(p=>byId[p.partnerId]&&gen[p.partnerId]===g&&!done.has(p.partnerId));
        if(pr){
          done.add(x.id);done.add(pr.partnerId);
          const pm=byId[pr.partnerId];
          const mLeft=x.gender==="M"||(x.gender!=="F"&&pm.gender==="F");
          units.push({couple:true,ids:mLeft?[x.id,pm.id]:[pm.id,x.id]});
        }
      });
      // Pass 2: divorced, widowed, and singles placed individually
      fam.forEach(x=>{
        if(done.has(x.id))return;
        done.add(x.id);
        units.push({couple:false,ids:[x.id]});
      });
      return units;
    }

    // Helper: do two famKeys share at least one parent? (indicates half-sibling groups)
    function sharesParent(fk1,fk2){const a=fk1.split("|").filter(Boolean);const b=fk2.split("|").filter(Boolean);return a.some(p=>p&&b.includes(p));}

    if(g===maxG){
      // C) Bottom generation: lay out families sequentially with FG between families
      let cur=80;
      let prevFkC=null;
      famKeys.forEach((fk,fi)=>{
        // Extra 80px gap between half-sibling groups (same shared parent, different other parent)
        if(prevFkC!==null&&sharesParent(prevFkC,fk))cur+=80;
        prevFkC=fk;
        const units=buildUnits(famMap[fk]);
        units.forEach(u=>{
          if(u.couple){
            posX[u.ids[0]]=cur;
            posX[u.ids[1]]=cur+CG;
            cur+=CG+MG;
          } else {
            posX[u.ids[0]]=cur;
            cur+=MG;
          }
        });
        cur+=FG-MG; // extra gap between families
      });
    } else {
      // D) Upper generations: build units across ALL members of this gen so
      // couples with different-family parents are correctly paired
      const allMembers=[];famKeys.forEach(fk=>famMap[fk].forEach(x=>allMembers.push(x)));
      const allUnits=buildUnits(allMembers);
      allUnits.sort((a,b)=>{
        function avgChildX(u){const xs=[];u.ids.forEach(id=>directKids(id).forEach(c=>{if(posX[c.id]!=null)xs.push(posX[c.id]);}));return xs.length?xs.reduce((s,v)=>s+v)/xs.length:Infinity;}
        return avgChildX(a)-avgChildX(b);
      });

      // Map member → famKey for half-sibling gap detection
      const mFk={};famKeys.forEach(fk=>famMap[fk].forEach(x=>mFk[x.id]=fk));

      let cur=80;
      const occupied=[]; // placed node X positions in this generation
      let prevUFk=null;
      allUnits.forEach(u=>{
        // Extra 80px gap when transitioning between half-sibling groups
        const curUFk=mFk[u.ids[0]]||null;
        if(prevUFk&&curUFk&&prevUFk!==curUFk&&sharesParent(prevUFk,curUFk))cur+=80;
        if(curUFk)prevUFk=curUFk;
        // Ideal X = midpoint of this unit's own direct children
        const childXs=[];
        u.ids.forEach(id=>directKids(id).forEach(c=>{if(posX[c.id]!=null&&!childXs.includes(posX[c.id]))childXs.push(posX[c.id]);}));
        const ideal=childXs.length?(Math.min(...childXs)+Math.max(...childXs))/2:null;

        // Max placed node X so far in this generation
        const maxOcc=occupied.length?Math.max(...occupied):-Infinity;

        if(u.couple){
          let cx=Math.max(ideal??cur+CG/2, cur+CG/2);
          // Ensure left member is ≥140px right of any placed node
          if(maxOcc>-Infinity)cx=Math.max(cx,maxOcc+140+CG/2);
          posX[u.ids[0]]=cx-CG/2;
          posX[u.ids[1]]=cx+CG/2;
          occupied.push(cx-CG/2,cx+CG/2);
          cur=cx+CG/2+MG;
        } else {
          let x;
          if(ideal!=null){
            x=Math.max(ideal,cur);
          } else {
            const genXs=gms.map(n=>posX[n.id]).filter(v=>v!=null);
            const minSafe=genXs.length?Math.max(...genXs)+MG:80;
            x=Math.max(minSafe,cur);
          }
          // Ensure ≥140px from any placed node
          if(maxOcc>-Infinity)x=Math.max(x,maxOcc+140);
          posX[u.ids[0]]=x;
          occupied.push(x);
          cur=x+MG;
        }
      });
    }
  }

  // E) Shift everything so minX=80 (stable, never root-dependent)
  const allXs=Object.values(posX);
  if(allXs.length){
    const shift=80-Math.min(...allXs);
    Object.keys(posX).forEach(id=>{posX[id]+=shift;});
  }

  m.forEach(x=>{x.x=posX[x.id]??80;x.y=(gen[x.id]??0)*220+100;});
  // Guarantee partners always share exact same Y
  m.forEach(x=>parsePartners(x.partnerships).forEach(pr=>{
    const pm=byId[pr.partnerId];if(!pm)return;
    if(x.y!==pm.y){const y=Math.min(x.y,pm.y);x.y=y;pm.y=y;}
  }));
  return m;
  }catch(e){console.error("autoLayout error:",e);return members.map((p,i)=>({...p,x:100+i*160,y:100}));}
}

function Avatar({photo,name,size=70,gender,deceased}){
  const ini=(name||"?").split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
  const grad=deceased?"linear-gradient(135deg,#666,#999)":(gender==="F"?"linear-gradient(135deg,#FF2D55,#FF6482)":"linear-gradient(135deg,#007AFF,#5AC8FA)");

  return <div style={{width:size,height:size,borderRadius:size/2,
    background:bgPhoto?`url(${bgPhoto}) center/cover no-repeat`:grad,

    margin:"0 auto",lineHeight:size+"px",textAlign:"center",

}

  const age=calcAge(m.birthDate,m.deceased?m.deathDate:null);

    <foreignObject key={m.id} x={m.x-75} y={m.y-55} width={150} height={cardH}>

        <div style={{marginTop:4,fontSize:14,fontWeight:700,color:m.deceased?"#888":"#000",height:18,...txt}}>
          {m.deceased&&<span style={{marginRight:2}}>†</span>}{d.first}
        </div>
        <div style={{fontSize:11,color:"#666",height:16,...txt}}>{d.last||""}</div>
        <div style={{fontSize:11,color:"#999",height:16}}>{age!==null?`${age} años`:""}</div>
        {pets.length>0&&<div style={{display:"flex",flexWrap:"wrap",gap:2,justifyContent:"center",padding:"3px 4px",marginTop:2,background:"rgba(120,120,128,0.07)",borderRadius:6}}>
          {pets.slice(0,3).map(p=><div key={p.id} style={{display:"flex",alignItems:"center",gap:2,background:"rgba(120,120,128,0.12)",borderRadius:8,padding:"1px 5px",fontSize:10,color:"#555"}}>
            {p.photo?<img src={p.photo} style={{width:14,height:14,borderRadius:7,objectFit:"cover"}}/>:<span>{p.deceased?"🕊️":(speciesEmoji[p.species]||"🐾")}</span>}
            <span style={{maxWidth:32,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name}</span>
          </div>)}
          {pets.length>3&&<span style={{fontSize:10,color:"#888"}}>+{pets.length-3}</span>}
        </div>}
      </div>
    </foreignObject>
  );
}

function TreeLines({members}){
  const lines=[];
  const byId=Object.fromEntries(members.map(m=>[m.id,m]));
  const drawn=new Set();

  // Couple lines
  members.forEach(m=>{
    parsePartners(m.partnerships).forEach(pr=>{
      const key=[m.id,pr.partnerId].sort().join("-");
      if(drawn.has(key))return;drawn.add(key);
      const sp=byId[pr.partnerId];if(!sp)return;
      if(Math.abs(m.y-sp.y)>10)return;
      const x1=Math.min(m.x,sp.x)+35,x2=Math.max(m.x,sp.x)-35;
      const y=(m.y+sp.y)/2-16;
      lines.push(<line key={`couple-${key}`} x1={x1} y1={y} x2={x2} y2={y}
        stroke="#bbb" strokeWidth={2}
        strokeOpacity={1} strokeDasharray={pr.type==="actual"?"":"5,5"}/>);
    });
  });

  // Parent-child lines grouped by parent pair (each couple gets its own separate branch)
  const familyGroups={};
  members.forEach(c=>{
    if(!c.parent1Id&&!c.parent2Id)return;
    const key=[c.parent1Id||"",c.parent2Id||""].sort().join("|");
    if(!familyGroups[key])familyGroups[key]={parents:[c.parent1Id,c.parent2Id].filter(Boolean),children:[]};
    familyGroups[key].children.push(c);
  });

  Object.values(familyGroups).forEach(fam=>{
    const parents=fam.parents.map(id=>byId[id]).filter(Boolean);
    const children=fam.children;
    if(!parents.length||!children.length)return;

    const pCX=parents.reduce((s,p)=>s+p.x,0)/parents.length;
    const elbowY=parents[0].y+110;   // fixed elbow 110px below parent center
    const sorted=[...children].sort((a,b)=>a.x-b.x);
    const minX=sorted[0].x, maxX=sorted[sorted.length-1].x;
    const centerX=(minX+maxX)/2;
    const barY=children[0].y-80;
    const childTopY=children[0].y-51;

    // 1. Vertical from couple center down to elbow level
    lines.push(<line key={`pv-${fam.parents.join("-")}`}
      x1={pCX} y1={parents[0].y+19} x2={pCX} y2={elbowY}
      stroke="#bbb" strokeWidth={2} strokeOpacity={1}/>);

    // 2. Horizontal elbow from couple X to children centerX (if offset)
    if(Math.abs(pCX-centerX)>2){
      lines.push(<line key={`pe-${fam.parents.join("-")}`}
        x1={pCX} y1={elbowY} x2={centerX} y2={elbowY}
        stroke="#bbb" strokeWidth={2} strokeOpacity={1}/>);
    }

    // 3. Vertical from centerX down to bar level
    lines.push(<line key={`pm-${fam.parents.join("-")}`}
      x1={centerX} y1={elbowY} x2={centerX} y2={barY}
      stroke="#bbb" strokeWidth={2} strokeOpacity={1}/>);

    // 4. Horizontal bar spanning minX to maxX (only for multiple children)
    if(children.length>1){
      lines.push(<line key={`ph-${fam.parents.join("-")}`}
        x1={minX} y1={barY} x2={maxX} y2={barY}
        stroke="#bbb" strokeWidth={2} strokeOpacity={1}/>);
    }

    // 5. Vertical drop from bar to each child
    sorted.forEach(c=>{
      lines.push(<line key={`cv-${c.id}`}
        x1={c.x} y1={barY} x2={c.x} y2={childTopY}
        stroke="#bbb" strokeWidth={2} strokeOpacity={1}/>);
    });
  });

  return <>{lines}</>;
}

/* ── Form components ── */
function Inp({value,onChange,placeholder,type="text",onClear}){
  const isDate=type==="date";
  const t=isDate&&!dateInputSupported?"text":type;
  const ph=isDate&&!dateInputSupported?"YYYY-MM-DD":placeholder;
  const extra=isDate&&!dateInputSupported?{pattern:"[0-9]{4}-[0-9]{2}-[0-9]{2}"}:{};

function PhotoUpload({photo,gender,name,onUp}){
  const inp=useRef(null);
  const imgRef=useRef(null);
  const cropperRef=useRef(null);
  const [cropSrc,setCropSrc]=useState(null);

  const go=e=>{
    const f=e.target.files?.[0];if(!f)return;
    e.target.value="";
    const reader=new FileReader();
    reader.onload=ev=>setCropSrc(ev.target.result);
    reader.readAsDataURL(f);
  };

  useEffect(()=>{
    if(!cropSrc||!imgRef.current)return;
    cropperRef.current=new Cropper(imgRef.current,{aspectRatio:1,viewMode:1,autoCropArea:1,movable:true,zoomable:true,rotatable:false,scalable:false});
    return()=>{cropperRef.current?.destroy();cropperRef.current=null;};
  },[cropSrc]);

  const confirm=()=>{
    if(!cropperRef.current)return;
    const canvas=cropperRef.current.getCroppedCanvas({width:200,height:200});
    onUp(canvas.toDataURL("image/jpeg",0.8));
    setCropSrc(null);
  };

  return <>
    <div onClick={()=>inp.current?.click()} style={{textAlign:"center",cursor:"pointer",padding:12}}>
      <Avatar photo={photo} name={name||"?"} size={80} gender={gender}/>
      <div style={{color:"#007AFF",fontSize:13,fontWeight:500,marginTop:6}}>{photo?"Cambiar foto":"Agregar foto"}</div>
      <input ref={inp} type="file" accept="image/*" onChange={go} style={{display:"none"}}/>

    {cropSrc&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:300,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16,padding:20}}>
      <div style={{maxWidth:320,width:"100%",maxHeight:"60vh",overflow:"hidden"}}>
        <img ref={imgRef} src={cropSrc} style={{maxWidth:"100%",display:"block"}}/>

        <button onClick={()=>setCropSrc(null)} style={{padding:"12px 28px",borderRadius:12,border:"none",background:"rgba(255,255,255,0.15)",color:"#fff",fontSize:16,fontWeight:600,cursor:"pointer"}}>Cancelar</button>
        <button onClick={confirm} style={{padding:"12px 28px",borderRadius:12,border:"none",background:"#007AFF",color:"#fff",fontSize:16,fontWeight:600,cursor:"pointer"}}>Usar foto</button>
      </div>

  </>;
}

const CAP_MONTHS=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
function fmtCaptureDate(d){if(!d)return"";const p=d.split("-");if(p.length<3)return d;const dt=new Date(d+"T00:00:00");if(isNaN(dt))return d;return`${dt.getDate()} ${CAP_MONTHS[dt.getMonth()]} ${dt.getFullYear()}`;}

function AddPhotoModal({memberId,members,onDone,onClose,initialTags,uploadFn}){
  const [phase,setPhase]=useState("pick"); // pick|crop|date|tag|saving
  const [cropSrc,setCropSrc]=useState(null);
  const [croppedB64,setCroppedB64]=useState(null);
  const [captureDate,setCaptureDate]=useState("");
  const [tags,setTags]=useState(initialTags!==undefined?initialTags:[memberId]);
  const imgRef=useRef(null);
  const cropperRef=useRef(null);
  const fileRef=useRef(null);

  useEffect(()=>{fileRef.current?.click();},[]);
  useEffect(()=>{
    if(phase!=="crop"||!cropSrc||!imgRef.current)return;
    cropperRef.current=new Cropper(imgRef.current,{aspectRatio:1,viewMode:1,autoCropArea:1,movable:true,zoomable:true,rotatable:false,scalable:false});
    return()=>{cropperRef.current?.destroy();cropperRef.current=null;};
  },[phase,cropSrc]);

  const onFile=e=>{const f=e.target.files?.[0];if(!f){onClose();return;}e.target.value="";const r=new FileReader();r.onload=ev=>{setCropSrc(ev.target.result);setPhase("crop");};r.readAsDataURL(f);};

  const doCrop=()=>{
    if(!cropperRef.current)return;
    setCroppedB64(cropperRef.current.getCroppedCanvas({width:400,height:400}).toDataURL("image/jpeg",0.8));
    // Extract EXIF date from original image
    const img=new Image();
    img.onload=()=>{
      const today=new Date().toISOString().split("T")[0];
      if(window.EXIF){
        EXIF.getData(img,function(){
          const raw=EXIF.getTag(this,"DateTimeOriginal")||EXIF.getTag(this,"DateTime")||"";
          const m=raw.match(/^(\d{4}):(\d{2}):(\d{2})/);
          setCaptureDate(m?`${m[1]}-${m[2]}-${m[3]}`:today);
        });
      } else {setCaptureDate(today);}
      setPhase("date");
    };
    img.src=cropSrc;
  };

  const doSave=async()=>{
    setPhase("saving");
    const photoId=genId();
    let url=croppedB64;
    try{url=uploadFn?await uploadFn(photoId,croppedB64):await uploadMemberPhoto(memberId,photoId,croppedB64);}catch(e){}
    onDone({id:photoId,url,tags,captureDate,createdAt:Date.now()});
  };
  const toggleTag=id=>setTags(t=>t.includes(id)?t.filter(x=>x!==id):[...t,id]);

  const overlay={position:"fixed",inset:0,background:"rgba(0,0,0,0.93)",zIndex:400,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:16};
  const btn=(label,onClick,bg="#007AFF")=><button onClick={onClick} style={{padding:"12px 28px",borderRadius:12,border:"none",background:bg,color:"#fff",fontSize:15,fontWeight:600,cursor:"pointer"}}>{label}</button>;

  return <div style={overlay}>
    <input ref={fileRef} type="file" accept="image/*" onChange={onFile} style={{display:"none"}}/>
    {phase==="pick"&&<div style={{color:"#fff",fontSize:16}}>Selecciona una foto…</div>}
    {phase==="crop"&&cropSrc&&<>
      <div style={{maxWidth:320,width:"100%",maxHeight:"55vh",overflow:"hidden"}}><img ref={imgRef} src={cropSrc} style={{maxWidth:"100%",display:"block"}}/></div>
      <div style={{display:"flex",gap:12,marginTop:16}}>{btn("Cancelar",onClose,"rgba(255,255,255,0.15)")}{btn("Siguiente →",doCrop)}</div>
    </>}
    {phase==="date"&&<>
      <div style={{background:"#1c1c1e",borderRadius:16,padding:20,width:"100%",maxWidth:360}}>
        <div style={{color:"#fff",fontSize:16,fontWeight:600,marginBottom:14}}>📅 Fecha de la foto</div>
        <input type="date" value={captureDate} onChange={e=>setCaptureDate(e.target.value)} style={{width:"100%",padding:"11px 14px",borderRadius:10,border:"none",fontSize:16,background:"rgba(255,255,255,0.1)",color:"#fff",boxSizing:"border-box",outline:"none"}}/>
        {captureDate&&<div style={{color:"rgba(255,255,255,0.5)",fontSize:13,marginTop:8,textAlign:"center"}}>{fmtCaptureDate(captureDate)}</div>}
      </div>
      <div style={{display:"flex",gap:12,marginTop:14}}>{btn("← Atrás",()=>setPhase("crop"),"rgba(255,255,255,0.15)")}{btn("Confirmar →",()=>setPhase("tag"))}</div>
    </>}
    {phase==="tag"&&<>
      <div style={{background:"#1c1c1e",borderRadius:16,padding:16,width:"100%",maxWidth:360,maxHeight:"62vh",overflowY:"auto"}}>
        <div style={{color:"#fff",fontSize:16,fontWeight:600,marginBottom:10}}>¿Quién aparece en la foto?</div>
        {[...members].sort((a,b)=>getDisplay(a).full.localeCompare(getDisplay(b).full)).map(m=>(
          <div key={m.id} onClick={()=>toggleTag(m.id)} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:"0.5px solid rgba(255,255,255,0.08)",cursor:"pointer"}}>
            <Avatar photo={m.photo} name={getDisplay(m).full} size={34} gender={m.gender}/>
            <span style={{flex:1,color:"#fff",fontSize:14}}>{getDisplay(m).full}</span>
            <div style={{width:22,height:22,borderRadius:11,background:tags.includes(m.id)?"#007AFF":"rgba(255,255,255,0.2)",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:13,flexShrink:0}}>{tags.includes(m.id)?"✓":""}</div>
          </div>
        ))}
      </div>
      <div style={{display:"flex",gap:12,marginTop:14}}>{btn("← Atrás",()=>setPhase("date"),"rgba(255,255,255,0.15)")}{btn("Guardar",doSave,"#34C759")}</div>
    </>}
    {phase==="saving"&&<div style={{color:"#fff",fontSize:16}}>Subiendo foto…</div>}
  </div>;
}

function PhotosTimeline({members,events,visibleIds,onTapPhoto}){
  const allPhotos=[];
  members.forEach(m=>(m.photos||[]).forEach(p=>allPhotos.push({...p,ownerId:m.id})));
  (events||[]).forEach(ev=>(ev.photos||[]).forEach(p=>allPhotos.push({...p,ownerId:"event:"+ev.id,eventId:ev.id})));
  const photos=visibleIds?allPhotos.filter(p=>{
    if(p.eventId){const ev=(events||[]).find(e=>e.id===p.eventId);return ev&&((ev.attendees||[]).some(id=>visibleIds.has(id))||(p.tags||[]).some(id=>visibleIds.has(id)));}
    return visibleIds.has(p.ownerId)||(p.tags||[]).some(id=>visibleIds.has(id));
  }):allPhotos;
  photos.sort((a,b)=>{
    const da=a.captureDate||"";const db=b.captureDate||"";
    if(da!==db)return db.localeCompare(da);
    return(b.createdAt||0)-(a.createdAt||0);
  });
  if(!photos.length)return <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:12,color:"rgba(60,60,67,0.5)"}}>
    <span style={{fontSize:48}}>📷</span>
    <span style={{fontSize:16}}>Sin fotos aún</span>
    <span style={{fontSize:13,textAlign:"center",padding:"0 40px"}}>Abre el perfil de un familiar y toca + en la sección Fotos para agregar</span>
  </div>;
  return <div style={{flex:1,overflowY:"auto",padding:4,background:"#F2F2F7"}}>
    <style>{"@media(min-width:600px){.photos-grid{column-count:4!important}}"}</style>
    <div className="photos-grid" style={{columnCount:2,columnGap:4}}>
      {photos.map((photo,i)=>{
        const tagged=(photo.tags||[]).map(id=>members.find(m=>m.id===id)).filter(Boolean);
        return <div key={photo.id||i} onClick={()=>onTapPhoto(photos,i)}
          style={{breakInside:"avoid",marginBottom:4,cursor:"pointer",borderRadius:10,overflow:"hidden",background:"#fff"}}>
          <img src={photo.url} style={{width:"100%",display:"block"}}/>
          {photo.captureDate&&<div style={{padding:"4px 8px 2px",fontSize:11,color:"#888"}}>{fmtCaptureDate(photo.captureDate)}</div>}
          {tagged.length>0&&<div style={{padding:"2px 8px 6px",display:"flex",flexWrap:"wrap",gap:4}}>
            {tagged.map(m=>(
              <div key={m.id} style={{display:"flex",alignItems:"center",gap:3,background:"rgba(0,122,255,0.08)",borderRadius:100,padding:"2px 7px"}}>
                <Avatar photo={m.photo} name={getDisplay(m).full} size={16} gender={m.gender} deceased={m.deceased}/>
                <span style={{fontSize:11,color:"#007AFF"}}>{getDisplay(m).first}</span>
              </div>
            ))}
          </div>}
        </div>;
      })}
    </div>
  </div>;
}

function CalendarView({members,events,onTapPerson,onTapEvent}){
  const [cal,setCal]=useState(()=>{const d=new Date();return{y:d.getFullYear(),m:d.getMonth()};});
  const [daySheet,setDaySheet]=useState(null);
  const {y,m}=cal;

  const evMap={};
  members.forEach(mem=>{
    const addEv=(dateStr,type)=>{
      if(!dateStr)return;
      const p=dateStr.split("-");if(p.length<3)return;
      const em=parseInt(p[1])-1,ed=parseInt(p[2]),ey=parseInt(p[0]);
      if(em!==m)return;
      if(!evMap[ed])evMap[ed]=[];
      evMap[ed].push({member:mem,type,years:y-ey});
    };
    addEv(mem.birthDate,"birthday");
    if(mem.deceased)addEv(mem.deathDate,"death");
  });
  (events||[]).forEach(ev=>{
    if(!ev.date)return;
    const p=ev.date.split("-");if(p.length<3)return;
    const em=parseInt(p[1])-1,ed=parseInt(p[2]);
    if(em!==m)return;
    if(!evMap[ed])evMap[ed]=[];
    evMap[ed].push({event:ev,type:ev.type,isEvent:true});
  });

  const firstDow=new Date(y,m,1).getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const today=new Date();
  const isToday=d=>today.getFullYear()===y&&today.getMonth()===m&&today.getDate()===d;

  const cells=[];
  for(let i=0;i<firstDow;i++)cells.push(null);
  for(let d=1;d<=daysInMonth;d++)cells.push(d);
  while(cells.length<42)cells.push(null);


  const prev=()=>setCal(c=>c.m===0?{y:c.y-1,m:11}:{y:c.y,m:c.m-1});
  const next=()=>setCal(c=>c.m===11?{y:c.y+1,m:0}:{y:c.y,m:c.m+1});

      <button onClick={next} style={{background:"none",border:"none",color:"#fff",fontSize:26,cursor:"pointer",lineHeight:1,padding:"0 8px"}}>→</button>
    </div>
    {/* Day headers */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",background:"#fff",borderBottom:"0.5px solid rgba(60,60,67,0.1)"}}>
      {CAL_DAYS.map(d=><div key={d} style={{textAlign:"center",padding:"6px 0",fontSize:11,fontWeight:600,color:"rgba(60,60,67,0.45)"}}>{d}</div>)}
    </div>
    </div>
    {/* Grid */}
    <div className="cal-grid" style={{padding:0,background:"rgba(60,60,67,0.08)"}}>
      {cells.map((day,i)=>{
        if(!day)return <div key={`x${i}`} style={{background:"#F2F2F7",opacity:0.3}}/>;
        const evs=evMap[day]||[];
        const hit=evs.length>0;
        const memberEvs=evs.filter(e=>!e.isEvent);
        const famEvs=evs.filter(e=>e.isEvent);
        const CellAvatar=({ev})=>{
          const mem=ev.member;
          const ini=(getDisplay(mem).full||"?").split(" ").map(x=>x[0]).join("").slice(0,2).toUpperCase();
          const isF=mem.gender==="F";const isDead=mem.deceased;

          const src=mem.photo?(isDead?mem.photo.replace("/upload/","/upload/e_grayscale/"):mem.photo):null;
          const bdr=isDead?"2px solid #999":(isF?"2px solid #FF2D55":"2px solid #007AFF");
          return <><div style={{width:"100%",height:"100%",borderRadius:"50%",background:src?`url(${src}) center/cover no-repeat`:grad,border:bdr,boxSizing:"border-box",overflow:"hidden",position:"relative"}}>
              {!src&&<div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:600,fontSize:"clamp(7px,2.5vw,13px)"}}>{ini}</div>}
            </div>
            <span style={{position:"absolute",top:"-8%",right:"-8%",fontSize:"clamp(10px,3.5vw,18px)",lineHeight:1}}>{ev.type==="birthday"?"🎉":"🕊️"}</span></>;
        };
        const AvatarWrap=({ev,style})=><div style={{aspectRatio:"1/1",maxWidth:"100%",position:"relative",flexShrink:0,...style}}><CellAvatar ev={ev}/></div>;
        let avatarBlock=null;

          avatarBlock=<div style={{display:"flex",justifyContent:"center",alignItems:"stretch",flex:1,overflow:"hidden",padding:1}}>
            <AvatarWrap ev={memberEvs[0]}/>
          </div>;
        } else if(memberEvs.length===2){
          avatarBlock=<div style={{display:"flex",flexDirection:"column",gap:1,flex:1,overflow:"hidden"}}>
            {memberEvs.map((ev,ei)=><div key={ei} style={{flex:1,display:"flex",justifyContent:"center",alignItems:"stretch",overflow:"hidden"}}>
              <AvatarWrap ev={ev}/>
            </div>)}

        } else if(memberEvs.length>2){
          avatarBlock=<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gridTemplateRows:"1fr 1fr",gap:1,flex:1,overflow:"hidden"}}>
            {memberEvs.slice(0,4).map((ev,ei)=><div key={ei} style={{display:"flex",justifyContent:"center",alignItems:"stretch",overflow:"hidden"}}>
              <AvatarWrap ev={ev}/>

          </div>;
        }
        return <div key={day} onClick={hit?()=>setDaySheet(evs):undefined}
          style={{background:"#fff",borderRadius:0,padding:"3px",overflow:"hidden",cursor:hit?"pointer":"default",
            outline:isToday(day)?"2px solid #007AFF":"none",outlineOffset:"-2px",boxSizing:"border-box",display:"flex",flexDirection:"column"}}>
          <div style={{fontSize:"clamp(8px,2vw,12px)",fontWeight:isToday(day)?700:400,color:isToday(day)?"#007AFF":"#1c1c1e",lineHeight:1,marginBottom:1,flexShrink:0}}>{day}</div>
          {avatarBlock}
          {famEvs.length>0&&<div style={{display:"flex",flexWrap:"wrap",gap:1,justifyContent:"center",marginTop:1,flexShrink:0}}>
            {famEvs.slice(0,2).map((e,i)=><span key={i} style={{fontSize:"clamp(10px,3.5vw,18px)"}}>{EV_ICONS[e.type]||"🎊"}</span>)}
            {famEvs.length>2&&<span style={{fontSize:"clamp(7px,1.8vw,10px)",color:"#007AFF"}}>+{famEvs.length-2}</span>}
          </div>}
        </div>;
      })}
    </div>
    {/* Day bottom sheet */}
    {daySheet&&<>
      <div onClick={()=>setDaySheet(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.3)",zIndex:50}}/>
      <div style={{position:"fixed",bottom:0,left:0,right:0,zIndex:60,background:"#F2F2F7",borderRadius:"14px 14px 0 0",maxHeight:"70vh",overflowY:"auto",paddingBottom:"env(safe-area-inset-bottom,20px)",animation:"sheetUp .3s ease-out"}}>
        <div style={{display:"flex",justifyContent:"center",padding:"10px 0 2px"}}><div style={{width:36,height:5,borderRadius:3,background:"rgba(60,60,67,0.15)"}}/></div>
        <div style={{display:"flex",justifyContent:"space-between",padding:"6px 20px 10px"}}>
          <button onClick={()=>setDaySheet(null)} style={{background:"none",border:"none",color:"#007AFF",fontSize:17,cursor:"pointer"}}>Cerrar</button>
          <span style={{fontSize:17,fontWeight:600}}>Eventos</span>
          <div style={{width:50}}/>
        </div>
        <div style={{padding:"0 16px 24px",display:"flex",flexDirection:"column",gap:10}}>

              <span style={{fontSize:40,lineHeight:1}}>{EV_ICONS[ev.type]||"🎊"}</span>
              <div>
                <div style={{fontWeight:600,fontSize:16}}>{ev.event.title}</div>
                <div style={{fontSize:14,color:"#888",marginTop:2}}>{(EV_LABELS||{})[ev.type]||"Evento"}{ev.event.date?" · "+fmtCaptureDate(ev.event.date):""}</div>
              </div>
            </div>
            :<div key={i} onClick={()=>{onTapPerson(ev.member.id);setDaySheet(null);}} style={{background:"#fff",borderRadius:12,padding:"12px 16px",display:"flex",alignItems:"center",gap:14,cursor:"pointer"}}>
              <Avatar photo={ev.member.photo} name={getDisplay(ev.member).full} size={54} gender={ev.member.gender} deceased={ev.member.deceased}/>
              <div>
                <div style={{fontWeight:600,fontSize:16}}>{getDisplay(ev.member).full}</div>
                <div style={{fontSize:14,color:ev.type==="birthday"?"#FF9500":"#888",marginTop:2}}>{ev.type==="birthday"?"🎉 Cumpleaños":"🕊️ Aniversario"}</div>
                <div style={{fontSize:12,color:"rgba(60,60,67,0.5)",marginTop:2}}>{ev.type==="birthday"?`${ev.years} años`:`${ev.years} años desde su partida`}</div>
              </div>
            </div>
          )}
        </div>
      </div>
    </>}
  </div>;
}

function getRelation(memberId,rootId,members){
  if(!rootId)return"distant";
  if(memberId===rootId)return"self";
  const byId=Object.fromEntries(members.map(m=>[m.id,m]));
  const root=byId[rootId];if(!root)return"distant";
  // "close": partners, parents, children, siblings — shown fully regardless of core tree
  const partners=parsePartners(root.partnerships).map(p=>p.partnerId);
  if(partners.includes(memberId))return"close";
  const parents=[root.parent1Id,root.parent2Id].filter(Boolean);
  if(parents.includes(memberId))return"close";
  const children=members.filter(m=>m.parent1Id===rootId||m.parent2Id===rootId).map(m=>m.id);
  if(children.includes(memberId))return"close";
  if(parents.length){
    const sibs=members.filter(m=>m.id!==rootId&&parents.some(p=>m.parent1Id===p||m.parent2Id===p)).map(m=>m.id);
    if(sibs.includes(memberId))return"close";
  }
  // "medium" only if member is in root's ancestor/descendant tree (BFS up + BFS down)
  const inCore=(()=>{
    let q=[rootId],vis=new Set();
    while(q.length){const id=q.shift();if(id===memberId)return true;if(vis.has(id))continue;vis.add(id);const nd=byId[id];if(!nd)continue;[nd.parent1Id,nd.parent2Id].filter(Boolean).forEach(p=>q.push(p));}
    q=[rootId];vis=new Set();
    while(q.length){const id=q.shift();if(id===memberId)return true;if(vis.has(id))continue;vis.add(id);members.filter(x=>x.parent1Id===id||x.parent2Id===id).forEach(c=>q.push(c.id));}
    return false;
  })();
  const gps=parents.flatMap(pid=>{const p=byId[pid];return p?[p.parent1Id,p.parent2Id].filter(Boolean):[];});
  if(gps.includes(memberId))return inCore?"medium":"distant";
  const gcs=children.flatMap(cid=>members.filter(m=>m.parent1Id===cid||m.parent2Id===cid).map(m=>m.id));
  if(gcs.includes(memberId))return inCore?"medium":"distant";
  const parentsPartners=parents.flatMap(pid=>{const p=byId[pid];return p?parsePartners(p.partnerships).map(x=>x.partnerId).filter(id=>id!==rootId):[];});
  if(parentsPartners.includes(memberId))return inCore?"medium":"distant";
  const childPartners=children.flatMap(cid=>{const c=byId[cid];return c?parsePartners(c.partnerships).map(x=>x.partnerId):[];});
  if(childPartners.includes(memberId))return inCore?"medium":"distant";
  if(parents.length){
    const sibs=members.filter(m=>m.id!==rootId&&parents.some(p=>m.parent1Id===p||m.parent2Id===p));
    const sibPartners=sibs.flatMap(s=>parsePartners(s.partnerships).map(x=>x.partnerId));
    if(sibPartners.includes(memberId))return inCore?"medium":"distant";
  }
  return"distant";
}

  const [addPhotoForEvent,setAddPhotoForEvent]=useState(null);
  const familyRootRef=useRef(localStorage.getItem("familyRoot"));
  const isLocal=useRef(false);
  const autoSaveTimer=useRef(null);
  const touchRef=useRef({});
  const canvasRef=useRef(null);

  const flash=msg=>{setToast(msg);setTimeout(()=>setToast(null),2000);};

  // Load from Firebase
  useEffect(()=>{
    dbRef.on("value",snap=>{
      if(isLocal.current){isLocal.current=false;return;}
      const val=snap.val();
      if(!val){setLoading(false);return;}
      const arr=Object.entries(val).map(([k,v])=>{
        const partnerships=parsePartners(v.partnerships);
        partnerships.forEach(p=>{
          if(p.type==="actual"||p.type==="casado")p.type="actual";
          else p.type="anterior";
        });
        let maritalStatus=v.maritalStatus;
        if(!maritalStatus){
          maritalStatus=partnerships.find(p=>p.type==="actual")?"casado":"soltero";
        }
        return {...v,id:v.id||k,partnerships,maritalStatus,photo:v.photo||null,pets:v.pets||[]};
      });
      setMembers(autoLayout(arr));
      setLoading(false);
    });
    return ()=>dbRef.off();
  },[]);

  useEffect(()=>{
    logsRef.limitToLast(50).on("value",snap=>{
      const val=snap.val();
      if(!val){setLogs([]);return;}
      setLogs(Object.values(val).sort((a,b)=>b.timestamp.localeCompare(a.timestamp)));
    });
    return()=>logsRef.off();
  },[]);

  useEffect(()=>{
    eventsRef.on("value",snap=>{
      const val=snap.val();
      if(!val){setEvents([]);return;}
      setEvents(Object.entries(val).map(([k,v])=>({...v,id:v.id||k})));
    });
    return()=>eventsRef.off();
  },[]);

  // Auto save
  const doSave=useCallback((data)=>{
    isLocal.current=true;
    saveToDB(data).then(()=>flash("Guardado ✓")).catch(()=>flash("Error al guardar"));
  },[]);

  const update=useCallback(fn=>{
    setMembers(prev=>{
      const next=autoLayout(typeof fn==="function"?fn(prev):fn);
      if(autoSaveTimer.current)clearTimeout(autoSaveTimer.current);
      autoSaveTimer.current=setTimeout(()=>doSave(next),0);
      return next;

            const t=touchRef.current;
            t.pinching=true;t.panning=false;
            t.initDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
            t.initZoom=zoom;
            t.pinchCX=(e.touches[0].clientX+e.touches[1].clientX)/2;
            t.pinchCY=(e.touches[0].clientY+e.touches[1].clientY)/2;
            t.initScrollLeft=canvasRef.current.scrollLeft;
            t.initScrollTop=canvasRef.current.scrollTop;
          } else if(e.touches.length===1){

            t.panning=true;t.pinching=false;
            t.startX=e.touches[0].clientX;t.startY=e.touches[0].clientY;

          }
        }}

            const next=Math.min(2.5,Math.max(0.2,t.initZoom*(dist/t.initDist)));

            canvasRef.current.scrollLeft=(t.initScrollLeft+t.pinchCX)*r-t.pinchCX;
            canvasRef.current.scrollTop=(t.initScrollTop+t.pinchCY)*r-t.pinchCY;
            setZoom(next);

            const dy=e.touches[0].clientY-t.startY;
            canvasRef.current.scrollLeft=t.scrollLeft-dx;

          }

      {(form.pets||[]).length>0&&<div style={{display:"flex",flexWrap:"wrap",gap:6,padding:"0 14px 8px"}}>
        {(form.pets||[]).map((p,i)=><div key={p.id} style={{display:"flex",alignItems:"center",gap:6,background:"#fff",border:"0.5px solid rgba(60,60,67,0.2)",borderRadius:100,padding:"4px 10px 4px 4px",cursor:"pointer"}} onClick={()=>setPetModal({ownerId:sel||"new",pet:p,idx:i})}>
          {p.photo?<img src={p.photo} style={{width:25,height:25,borderRadius:12.5,objectFit:"cover"}}/>:<Avatar photo={null} name={p.name||"?"} size={25} gender={p.gender}/>}
          <span style={{fontSize:13}}>{p.deceased?"🕊️":(speciesEmoji[p.species]||"🐾")} {p.name}</span>
          {calcAge(p.birthDate,p.deceased?p.deathDate:null)!==null&&<span style={{fontSize:11,color:"#888"}}>{calcAge(p.birthDate,p.deceased?p.deathDate:null)}a</span>}
          <span onClick={e=>{e.stopPropagation();setForm({...form,pets:(form.pets||[]).filter((_,j)=>j!==i)});}} style={{cursor:"pointer",color:"#FF3B30",fontWeight:700,marginLeft:2}}>×</span>
        </div>)}
      </div>}
      <button onClick={()=>setPetModal({ownerId:sel||"new",pet:null,idx:-1})} style={{marginLeft:14,marginBottom:8,padding:"6px 14px",background:"rgba(120,120,128,0.1)",border:"none",borderRadius:100,fontSize:13,cursor:"pointer",color:"#007AFF"}}>+ Agregar mascota</button>
      <button onClick={saveForm} style={{width:"100%",marginTop:16,padding:"14px 0",background:"#007AFF",border:"none",borderRadius:12,color:"#fff",fontSize:17,fontWeight:600,cursor:"pointer"}}>
        {panel==="add"?"Agregar":"Guardar cambios"}
      </button>
    </div>)}

    {/* Partners */}
    {panel==="partners"&&selM&&sheet("Parejas de "+getDisplay(selM).first,close,<div style={{display:"flex",flexDirection:"column",gap:12}}>
      {selM.partnerships.map(pr=>{
        const p=members.find(m=>m.id===pr.partnerId);if(!p)return null;
        const prColors={actual:"#34C759",anterior:"#888"};
        const prLabels={actual:"Pareja actual",anterior:"Ex pareja"};
        return <div key={pr.partnerId} style={{background:"#fff",borderRadius:12,padding:"10px 14px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div onClick={()=>setEditPartner({partnerId:pr.partnerId,type:pr.type})} style={{display:"flex",alignItems:"center",gap:10,flex:1,cursor:"pointer"}}>
            <Avatar photo={p.photo} name={getDisplay(p).full} size={40} gender={p.gender}/>
            <div>
              <div style={{fontWeight:600}}>{getDisplay(p).full}</div>
              <div style={{fontSize:12,color:prColors[pr.type]||"#888",fontWeight:500}}>{prLabels[pr.type]||pr.type}</div>
            </div>
          </div>
          <button onClick={()=>removePartner(pr.partnerId)} style={{width:28,height:28,borderRadius:14,background:"rgba(120,120,128,0.12)",border:"none",color:"#FF3B30",fontSize:16,fontWeight:700,cursor:"pointer"}}>×</button>
        </div>;})}
      <SecTitle>Agregar pareja</SecTitle>
      <Sel value={pForm.partnerId} onChange={e=>setPForm({...pForm,partnerId:e.target.value})}>
        <option value="">Seleccionar persona…</option>
        {members.filter(m=>m.id!==sel&&!selM.partnerships.find(x=>x.partnerId===m.id)).map(m=><option key={m.id} value={m.id}>{getDisplay(m).full}</option>)}
      </Sel>
      <Sel value={pForm.type} onChange={e=>setPForm({...pForm,type:e.target.value})}>
        <option value="actual">Pareja actual</option>
        <option value="anterior">Ex pareja</option>
      </Sel>
      <button onClick={addPartner} disabled={!pForm.partnerId} style={{width:"100%",padding:"12px 0",background:pForm.partnerId?"#007AFF":"rgba(120,120,128,0.12)",border:"none",borderRadius:12,color:pForm.partnerId?"#fff":"#999",fontSize:16,fontWeight:600,cursor:pForm.partnerId?"pointer":"default"}}>Agregar pareja</button>
    </div>)}

    {/* Personas drawer */}
    {showFamilias&&<>
      <div onClick={()=>setShowFamilias(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.3)",zIndex:998}}/>
      <div style={{position:"fixed",top:0,right:0,bottom:0,width:300,height:"100vh",zIndex:999,background:"#fff",animation:"slideInRight .28s ease-out",display:"flex",flexDirection:"column",paddingBottom:"env(safe-area-inset-bottom,20px)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 16px 10px",borderBottom:"0.5px solid rgba(60,60,67,0.12)"}}>
          <span style={{fontSize:17,fontWeight:600}}>Familias</span>
          <button onClick={()=>setShowFamilias(false)} style={{background:"none",border:"none",color:"#007AFF",fontSize:17,cursor:"pointer"}}>Cerrar</button>
        </div>
        <div style={{overflowY:"auto",flex:1}}>
          <div onClick={()=>{setFamilyView("general");setShowFamilias(false);}} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 16px",borderBottom:"0.5px solid rgba(60,60,67,0.07)",cursor:"pointer",background:familyView==="general"?"rgba(0,122,255,0.08)":"transparent"}}>
            <span style={{fontSize:22}}>🌳</span>
            <span style={{fontSize:15,fontWeight:600}}>Árbol General</span>
          </div>
          {getFamilies().map(fam=>(
            <div key={fam.id} onClick={()=>{setFamilyView(fam.id);setShowFamilias(false);}} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 16px",borderBottom:"0.5px solid rgba(60,60,67,0.07)",cursor:"pointer",background:familyView===fam.id?"rgba(0,122,255,0.08)":"transparent"}}>
              <span style={{fontSize:22}}>👨‍👩‍👧‍👦</span>
              <span style={{fontSize:15,fontWeight:500}}>Familia {fam.name}</span>
            </div>
          ))}
        </div>
      </div>
    </>}

    {showPersonas&&<>
      <div onClick={()=>setShowPersonas(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.3)",zIndex:998}}/>
      <div style={{position:"fixed",top:0,right:0,bottom:0,width:300,height:"100vh",zIndex:999,background:"#fff",animation:"slideInRight .28s ease-out",display:"flex",flexDirection:"column",paddingBottom:"env(safe-area-inset-bottom,20px)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 16px 10px",borderBottom:"0.5px solid rgba(60,60,67,0.12)"}}>
          <span style={{fontSize:17,fontWeight:600}}>Personas</span>
          <button onClick={()=>setShowPersonas(false)} style={{background:"none",border:"none",color:"#007AFF",fontSize:17,cursor:"pointer"}}>Cerrar</button>
        </div>
        <div style={{overflowY:"auto",flex:1}}>
          {[...members].sort((a,b)=>(a.firstName||"").localeCompare(b.firstName||"")).map(m=>{
            const d=getDisplay(m);
            const age=calcAge(m.birthDate,m.deceased?m.deathDate:null);
            return <div key={m.id} onClick={()=>{
              setShowPersonas(false);
              saveRoot(m.id);
              tapCard(m.id);
              setTimeout(()=>{
                if(!canvasRef.current)return;
                const rm=members.find(x=>x.id===m.id);if(!rm)return;
                const vw=window.innerWidth,vh=window.innerHeight-60;
                canvasRef.current.scrollTo({left:Math.max(0,rm.x*zoom-vw/2),top:Math.max(0,rm.y*zoom-vh/2),behavior:"smooth"});
              },80);
            }} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 16px",borderBottom:"0.5px solid rgba(60,60,67,0.07)",cursor:"pointer",background:familyRoot===m.id?"rgba(0,122,255,0.08)":"transparent"}}>
              <Avatar photo={m.photo} name={d.full} size={40} gender={m.gender} deceased={m.deceased}/>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:15,fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{d.full}</div>
                <div style={{fontSize:12,color:"#888"}}>{age!==null?`${age} años · `:""}{m.deceased?"🕊️":"💚"}</div>
              </div>
            </div>;
          })}
        </div>
      </div>
    </>}

    {/* Family chip */}
    {(()=>{
      const activeFam=familyView!=="general"?getFamilies().find(f=>f.id===familyView):null;
      const famLabel=activeFam?"Familia "+activeFam.name:"Árbol General";
      return <div onClick={()=>setShowFamilias(true)} style={{position:"fixed",bottom:90,right:20,zIndex:50,background:"#fff",borderRadius:100,padding:"6px 12px 6px 10px",display:"flex",alignItems:"center",gap:8,boxShadow:"0 2px 12px rgba(0,0,0,0.18)",cursor:"pointer"}}>
        <span style={{fontSize:20,lineHeight:1}}>👨‍👩‍👧‍👦</span>
        <span style={{fontSize:13,fontWeight:600}}>{famLabel}</span>
      </div>;
    })()}

    {/* Root person chip */}
    {familyRoot&&(()=>{
      const rm=members.find(m=>m.id===familyRoot);if(!rm)return null;
      return <div onClick={()=>{setRootSelect(familyRoot);setShowRootModal(true);}} style={{position:"fixed",bottom:20,right:20,zIndex:50,background:"#fff",borderRadius:100,padding:"6px 12px 6px 6px",display:"flex",alignItems:"center",gap:8,boxShadow:"0 2px 12px rgba(0,0,0,0.18)",cursor:"pointer"}}>
        <Avatar photo={rm.photo} name={getDisplay(rm).full} size={32} gender={rm.gender}/>
        <span style={{fontSize:13,fontWeight:600}}>{getDisplay(rm).first}</span>
      </div>;
    })()}

    {/* Who are you modal */}
    {showRootModal&&members.length>0&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:"#F2F2F7",borderRadius:20,padding:24,width:"min(340px,100%)",display:"flex",flexDirection:"column",gap:16}}>
        <div style={{fontSize:20,fontWeight:700,textAlign:"center"}}>¿Quién eres?</div>
        <Sel value={rootSelect} onChange={e=>setRootSelect(e.target.value)}>
          <option value="">Selecciona tu nombre...</option>
          {[...members].filter(m=>!m.deceased).sort((a,b)=>getDisplay(a).full.localeCompare(getDisplay(b).full)).map(m=><option key={m.id} value={m.id}>{getDisplay(m).full}</option>)}
        </Sel>
        <button onClick={()=>{setShowRootModal(false);openAdd();}} style={{padding:"12px 0",background:"transparent",border:"1px solid rgba(60,60,67,0.25)",borderRadius:12,color:"rgba(60,60,67,0.7)",fontSize:15,fontWeight:500,cursor:"pointer"}}>✨ Registrarme</button>
        <button onClick={()=>{if(rootSelect)saveRoot(rootSelect);}} disabled={!rootSelect} style={{padding:"14px 0",background:rootSelect?"#007AFF":"rgba(120,120,128,0.12)",border:"none",borderRadius:12,color:rootSelect?"#fff":"#999",fontSize:17,fontWeight:600,cursor:rootSelect?"pointer":"default"}}>Continuar</button>
        {familyRoot&&<button onClick={()=>setShowRootModal(false)} style={{padding:"10px 0",background:"none",border:"none",color:"#007AFF",fontSize:15,cursor:"pointer"}}>Cancelar</button>}
      </div>
    </div>}
    {addPhotoFor&&<AddPhotoModal
      memberId={addPhotoFor}
      members={members}
      onClose={()=>setAddPhotoFor(null)}
      onDone={photoData=>{addMemberPhoto(addPhotoFor,photoData);setAddPhotoFor(null);flash("Foto guardada ✓");}}
    />}
    {showAddEvent&&<AddEventModal
      members={members}
      onClose={()=>setShowAddEvent(false)}
      onDone={ev=>{saveEvent(ev);setShowAddEvent(false);flash("Evento creado ✓");}}
    />}
    {viewEvent&&<EventViewModal
      event={viewEvent}
      members={members}
      onClose={()=>setViewEvent(null)}
      onAddPhoto={()=>setAddPhotoForEvent(viewEvent.id)}
      onTapPhoto={(photos,idx)=>setPhotoView({photos,idx})}
    />}
    {addPhotoForEvent&&<AddPhotoModal
      memberId={addPhotoForEvent}
      members={members}
      initialTags={[]}
      uploadFn={(photoId,b64)=>uploadEventPhoto(addPhotoForEvent,photoId,b64)}
      onClose={()=>setAddPhotoForEvent(null)}
      onDone={photoData=>{addEventPhoto(addPhotoForEvent,photoData);setAddPhotoForEvent(null);flash("Foto guardada ✓");}}
    />}
    {photoView&&<PhotoViewModal
      photos={photoView.photos}
      initIdx={photoView.idx}
      members={members}
      onClose={()=>setPhotoView(null)}
      onUpdateTags={(photo,tags)=>{if(photo.eventId)updateEventPhotoTags(photo.eventId,photo,tags);else updatePhotoTags(photo,tags);flash("Tags actualizados ✓");}}
    />}

    {/* History trigger */}
    <div onClick={()=>setShowLogs(true)} style={{position:"fixed",bottom:20,left:20,zIndex:50,width:32,height:32,borderRadius:16,background:"rgba(0,0,0,0.45)",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",opacity:0.3,fontSize:18,color:"#fff",fontWeight:700,lineHeight:1}}>⋯</div>

    {/* Historial drawer */}
    {showLogs&&<>
      <div onClick={()=>setShowLogs(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.3)",zIndex:998}}/>
      <div style={{position:"fixed",bottom:0,left:0,right:0,zIndex:999,background:"#F2F2F7",borderRadius:"14px 14px 0 0",maxHeight:"72vh",overflowY:"auto",paddingBottom:"env(safe-area-inset-bottom,20px)",animation:"sheetUp .3s ease-out"}}>
        <div style={{display:"flex",justifyContent:"center",padding:"10px 0 2px"}}><div style={{width:36,height:5,borderRadius:3,background:"rgba(60,60,67,0.15)"}}/></div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 20px 10px"}}>
          <button onClick={()=>setShowLogs(false)} style={{background:"none",border:"none",color:"#007AFF",fontSize:17,cursor:"pointer"}}>Cerrar</button>
          <span style={{fontSize:17,fontWeight:600}}>Historial</span>
          <div style={{width:50}}/>
        </div>
        <div style={{padding:"0 16px 24px",display:"flex",flexDirection:"column",gap:8}}>
          {logs.length===0&&<div style={{textAlign:"center",color:"rgba(60,60,67,0.4)",padding:32,fontSize:15}}>Sin cambios registrados</div>}
          {logs.map((log,i)=>{
            const actor=members.find(m=>m.id===log.userId);
            const target=members.find(m=>m.id===log.targetId);
            const aColor=log.action==="create"?"#34C759":log.action==="delete"?"#FF3B30":"#007AFF";
            const aIcon=log.action==="create"?"+":log.action==="delete"?"×":"✎";
            return <div key={i} style={{background:"#fff",borderRadius:12,padding:"10px 12px",display:"flex",alignItems:"center",gap:10}}>
              {actor?<Avatar photo={actor.photo} name={getDisplay(actor).full} size={36} gender={actor.gender} deceased={actor.deceased}/>
                :<div style={{width:36,height:36,borderRadius:18,background:"rgba(120,120,128,0.18)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>👤</div>}
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:13,fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{log.details}</div>
                <div style={{display:"flex",alignItems:"center",gap:6,marginTop:3}}>
                  <span style={{fontSize:11,color:"rgba(60,60,67,0.45)"}}>{timeAgo(log.timestamp)}</span>
                  {target&&<span style={{fontSize:11,background:"rgba(0,122,255,0.1)",color:"#007AFF",borderRadius:100,padding:"1px 7px"}}>{getDisplay(target).first}</span>}
                </div>
              </div>
              <div style={{width:22,height:22,borderRadius:11,background:aColor,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:13,fontWeight:700,flexShrink:0}}>{aIcon}</div>
            </div>;
          })}
        </div>
      </div>
    </>}
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
