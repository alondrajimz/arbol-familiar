/* ── helpers ── */
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function calcAge(birth,death){
  if(!birth)return null;
  const b=new Date(birth),d=death?new Date(death):new Date();
  if(isNaN(b))return null;
  let a=d.getFullYear()-b.getFullYear();
  if(d.getMonth()<b.getMonth()||(d.getMonth()===b.getMonth()&&d.getDate()<b.getDate()))a--;
  return a>=0?a:null;
}
function getDisplay(m){
  const first=m.firstName||(m.name?m.name.split(" ")[0]:"");
  const l1=m.lastName1||(m.name?m.name.split(" ")[1]||"":"");
  const l2=m.lastName2||(m.name?m.name.split(" ").slice(2).join(" "):"");
  return {first,last:([l1,l2].filter(Boolean).join(" ")),full:([first,l1,l2].filter(Boolean).join(" "))};
}
function parsePartners(p){if(!p)return[];if(Array.isArray(p))return p;return Object.values(p);}
const dateInputSupported=(()=>{try{const i=document.createElement("input");i.setAttribute("type","date");i.value="not-a-date";return i.value!=="not-a-date";}catch(e){return false;}})();

/* ── LAYOUT ALGORITHM ── */
function autoLayout(members, rootId){
  try{
  if(!members.length)return members;
  const m=members.map(x=>({...x}));
  const byId=Object.fromEntries(m.map(x=>[x.id,x]));

  // Step 1: gen 0 = roots, children = parent gen + 1
  const gen={};
  m.forEach(x=>{if(!x.parent1Id&&!x.parent2Id)gen[x.id]=0;});
  let chg=true,it=0;
  while(chg&&it++<100){chg=false;m.forEach(x=>{
    if(gen[x.id]!=null)return;
    const gs=[x.parent1Id,x.parent2Id].filter(Boolean).map(id=>gen[id]).filter(g=>g!=null);
    if(gs.length){gen[x.id]=Math.max(...gs)+1;chg=true;}
  });}
  m.forEach(x=>{if(gen[x.id]==null)gen[x.id]=0;});

  // Steps 2-4 in one outer loop until stable (max 100 passes)
  chg=true;it=0;
  const coupleForced=new Set();
  while(chg&&it++<100){
    chg=false;
    // Partners → same gen (priority: if one has parents, other adopts that gen)
    m.forEach(x=>parsePartners(x.partnerships).forEach(pr=>{
      if(gen[pr.partnerId]==null)return;
      const xP=!!(x.parent1Id||x.parent2Id);
      const pP=!!(byId[pr.partnerId]?.parent1Id||byId[pr.partnerId]?.parent2Id);
      const g=(!xP&&pP)?gen[pr.partnerId]:(xP&&!pP)?gen[x.id]:Math.min(gen[x.id],gen[pr.partnerId]);
      if(gen[x.id]!==g){gen[x.id]=g;chg=true;coupleForced.add(x.id);}
      if(gen[pr.partnerId]!==g){gen[pr.partnerId]=g;chg=true;coupleForced.add(pr.partnerId);}
    }));
    // Siblings → same gen (max = deepest sibling's row, keeps all on one row)
    const sibs={};
    m.forEach(x=>[x.parent1Id,x.parent2Id].filter(Boolean).forEach(pid=>{
      if(!sibs[pid])sibs[pid]=[];
      if(!sibs[pid].includes(x.id))sibs[pid].push(x.id);
    }));
    Object.values(sibs).forEach(ids=>{
      const parentGens=ids.map(id=>{const x=byId[id];const gs=[x.parent1Id,x.parent2Id].filter(Boolean).map(p=>gen[p]).filter(g=>g!=null);return gs.length?Math.max(...gs)+1:gen[id]??0;});
      const targetG=Math.max(...parentGens);
      ids.forEach(id=>{if((gen[id]??0)!==targetG){gen[id]=targetG;chg=true;}});
    });
    // Children strictly below every parent (skipped if partner rule already placed them)
    m.forEach(x=>{
      if(coupleForced.has(x.id))return;
      const gs=[x.parent1Id,x.parent2Id].filter(Boolean).map(id=>gen[id]).filter(g=>g!=null);
      if(!gs.length)return;
      const n=Math.max(...gs)+1;
      if((gen[x.id]??0)<n){gen[x.id]=n;chg=true;}
    });
  }

  const CG=130; // couple center-to-center (70px avatar + 60px gap)
  const MG=185; // min gap between node centers (card is 150px wide → 35px margin)
  const FG=260; // gap between different families
  const maxG=Math.max(...Object.values(gen),0);
  const posX={};

  // Build family key for each member: sorted parent ids
  function famKey(x){return[x.parent1Id||"",x.parent2Id||""].sort().join("|");}
  // Direct children of a specific person (not via their partner)
  function directKids(id){return m.filter(c=>c.parent1Id===id||c.parent2Id===id);}

  // X positions: bottom-up, generation by generation
  for(let g=maxG;g>=0;g--){
    const gms=m.filter(x=>gen[x.id]===g);

    // A) Group by family (same parents), sort each family by birthDate
    const famMap={};
    gms.forEach(x=>{
      const k=famKey(x);
      if(!famMap[k])famMap[k]=[];
      famMap[k].push(x);
    });
    Object.values(famMap).forEach(fam=>fam.sort((a,b)=>(a.birthDate||"").localeCompare(b.birthDate||"")));

    // Sort families by earliest birthDate in the family (applies to all generations)
    const famKeys=Object.keys(famMap).sort((ka,kb)=>{
      const aDate=famMap[ka].map(x=>x.birthDate||"9999").sort()[0];
      const bDate=famMap[kb].map(x=>x.birthDate||"9999").sort()[0];
      return aDate.localeCompare(bDate);
    });

    // For each family, build couple/single units
    function buildUnits(fam){
      const done=new Set();const units=[];
      fam.forEach(x=>{
        if(done.has(x.id))return;done.add(x.id);
        const pr=parsePartners(x.partnerships).sort((a,b)=>(a.type==="actual"?0:1)-(b.type==="actual"?0:1)).find(p=>byId[p.partnerId]&&gen[p.partnerId]===g&&!done.has(p.partnerId));
        if(pr){
          const pm=byId[pr.partnerId];done.add(pm.id);
          const mLeft=x.gender==="M"||(x.gender!=="F"&&pm.gender==="F");
          units.push({couple:true,ids:mLeft?[x.id,pm.id]:[pm.id,x.id]});
        } else {
          units.push({couple:false,ids:[x.id]});
        }
      });
      return units;
    }

    if(g===maxG){
      // C) Bottom generation: lay out families sequentially with FG between families
      let cur=80;
      famKeys.forEach((fk,fi)=>{
        const units=buildUnits(famMap[fk]);
        units.forEach(u=>{
          if(u.couple){
            posX[u.ids[0]]=cur;
            posX[u.ids[1]]=cur+CG;
            cur+=CG+MG;
          } else {
            posX[u.ids[0]]=cur;
            cur+=MG;
          }
        });
        cur+=FG-MG; // extra gap between families
      });
    } else {
      // D) Upper generations: build units across ALL members of this gen so
      // couples with different-family parents are correctly paired
      const allMembers=[];famKeys.forEach(fk=>famMap[fk].forEach(x=>allMembers.push(x)));
      const allUnits=buildUnits(allMembers);
      allUnits.sort((a,b)=>{
        function avgChildX(u){const xs=[];u.ids.forEach(id=>directKids(id).forEach(c=>{if(posX[c.id]!=null)xs.push(posX[c.id]);}));return xs.length?xs.reduce((s,v)=>s+v)/xs.length:Infinity;}
        return avgChildX(a)-avgChildX(b);
      });

      let cur=80;
      allUnits.forEach(u=>{
        // Ideal X = midpoint of this unit's own direct children
        const childXs=[];
        u.ids.forEach(id=>directKids(id).forEach(c=>{if(posX[c.id]!=null&&!childXs.includes(posX[c.id]))childXs.push(posX[c.id]);}));
        const ideal=childXs.length?(Math.min(...childXs)+Math.max(...childXs))/2:null;

        if(u.couple){
          const cx=Math.max(ideal??cur+CG/2, cur+CG/2);
          posX[u.ids[0]]=cx-CG/2;
          posX[u.ids[1]]=cx+CG/2;
          cur=cx+CG/2+MG;
        } else {
          let x;
          if(ideal!=null){
            x=Math.max(ideal,cur);
          } else {
            const genXs=gms.map(n=>posX[n.id]).filter(v=>v!=null);
            const minSafe=genXs.length?Math.max(...genXs)+MG:80;
            x=Math.max(minSafe,cur);
          }
          posX[u.ids[0]]=x;
          cur=x+MG;
        }
      });
    }
  }

  // E) Center root person at window.innerWidth/2, fallback to minX=80
  const allXs=Object.values(posX);
  if(allXs.length){
    if(rootId&&posX[rootId]!=null){
      const cx=(typeof window!=="undefined"?window.innerWidth:800)/2;
      const s=cx-posX[rootId];
      Object.keys(posX).forEach(id=>{posX[id]+=s;});
      const minX=Math.min(...Object.values(posX));
      if(minX<80){const fix=80-minX;Object.keys(posX).forEach(id=>{posX[id]+=fix;});}
    } else {
      const shift=80-Math.min(...allXs);
      Object.keys(posX).forEach(id=>{posX[id]+=shift;});
    }
  }

  m.forEach(x=>{x.x=posX[x.id]??80;x.y=(gen[x.id]??0)*220+100;});
  // Guarantee partners always share exact same Y
  m.forEach(x=>parsePartners(x.partnerships).forEach(pr=>{
    const pm=byId[pr.partnerId];if(!pm)return;
    if(x.y!==pm.y){const y=Math.min(x.y,pm.y);x.y=y;pm.y=y;}
  }));
  // Tag inCoreTree: BFS up ancestors + BFS down descendants from rootId
  if(rootId&&byId[rootId]){
    const core=new Set([rootId]);
    const aq=[rootId];
    while(aq.length){const id=aq.shift();const nd=byId[id];if(!nd)continue;[nd.parent1Id,nd.parent2Id].filter(Boolean).forEach(pid=>{if(!core.has(pid)){core.add(pid);aq.push(pid);}});}
    const dq=[rootId];
    while(dq.length){const id=dq.shift();m.filter(x=>x.parent1Id===id||x.parent2Id===id).forEach(c=>{if(!core.has(c.id)){core.add(c.id);dq.push(c.id);}});}
    m.forEach(x=>{x.inCoreTree=core.has(x.id);});
  }
  return m;
  }catch(e){console.error("autoLayout error:",e);return members.map((p,i)=>({...p,x:100+i*160,y:100}));}
}

function stripPhotos(members){

  stripPhotos(members).forEach(m=>{data[m.id]=m;});
  return dbRef.set(data);
}

function TreeLines({members,relations={}}){
  const lines=[];
  const byId=Object.fromEntries(members.map(m=>[m.id,m]));
  const drawn=new Set();
  const isDistant=id=>relations[id]==="distant";

  // Couple lines
  members.forEach(m=>{
    parsePartners(m.partnerships).forEach(pr=>{
      const key=[m.id,pr.partnerId].sort().join("-");
      if(drawn.has(key))return;drawn.add(key);
      const sp=byId[pr.partnerId];if(!sp)return;
      if(Math.abs(m.y-sp.y)>10)return;
      const x1=Math.min(m.x,sp.x)+35,x2=Math.max(m.x,sp.x)-35;
      const y=(m.y+sp.y)/2-16;
      const so=isDistant(m.id)&&isDistant(pr.partnerId)?0.1:1;
      lines.push(<line key={`couple-${key}`} x1={x1} y1={y} x2={x2} y2={y}
        stroke={pr.type==="anterior"?"#ccc":"#bbb"} strokeWidth={2}
        strokeOpacity={so} strokeDasharray={pr.type==="anterior"?"5 4":"none"}/>);
    });
  });

  // Parent-child lines grouped by parent pair
  const familyGroups={};
  members.forEach(c=>{
    if(!c.parent1Id&&!c.parent2Id)return;
    const key=[c.parent1Id||"",c.parent2Id||""].sort().join("|");
    if(!familyGroups[key])familyGroups[key]={parents:[c.parent1Id,c.parent2Id].filter(Boolean),children:[]};
    familyGroups[key].children.push(c);
  });

  Object.values(familyGroups).forEach(fam=>{
    const parents=fam.parents.map(id=>byId[id]).filter(Boolean);
    const children=fam.children;
    if(!parents.length||!children.length)return;

    const allIds=[...fam.parents,...children.map(c=>c.id)];
    const so=allIds.every(id=>isDistant(id))?0.1:1;

    const parentCenterX=parents.reduce((s,p)=>s+p.x,0)/parents.length;
    const parentY=parents[0].y+19;
    const childY=children[0].y-51;
    const midY=(parentY+childY)/2;

    lines.push(<line key={`pv-${fam.parents.join("-")}`}
      x1={parentCenterX} y1={parentY} x2={parentCenterX} y2={midY}
      stroke="#bbb" strokeWidth={2} strokeOpacity={so}/>);

    const childXs=children.map(c=>c.x).sort((a,b)=>a-b);
    const barLeft=Math.min(parentCenterX,childXs[0]);
    const barRight=Math.max(parentCenterX,childXs[childXs.length-1]);

    if(children.length>1||Math.abs(parentCenterX-childXs[0])>5){
      lines.push(<line key={`ph-${fam.parents.join("-")}`}
        x1={barLeft} y1={midY} x2={barRight} y2={midY}
        stroke="#bbb" strokeWidth={2} strokeOpacity={so}/>);
    }

    children.forEach(c=>{
      const cso=isDistant(c.id)&&so===0.1?0.1:so===0.1?0.1:isDistant(c.id)?0.1:1;
      lines.push(<line key={`cv-${c.id}`}
        x1={c.x} y1={midY} x2={c.x} y2={childY}
        stroke="#bbb" strokeWidth={2} strokeOpacity={cso}/>);
    });
  });

  return <>{lines}</>;
}

function PhotoUpload({photo,gender,name,onUp}){
  const inp=useRef(null);
  const go=e=>{const f=e.target.files?.[0];if(!f)return;
    const img=new Image(),reader=new FileReader();
    reader.onload=ev=>{img.onload=()=>{
      const c=document.createElement("canvas");const max=200;
      let w=img.width,h=img.height;
      if(w>h){if(w>max){h=h*(max/w);w=max;}}else{if(h>max){w=w*(max/h);h=max;}}
      c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);
      onUp(c.toDataURL("image/jpeg",0.7));
    };img.src=ev.target.result;};reader.readAsDataURL(f);};
  return <div onClick={()=>inp.current?.click()} style={{textAlign:"center",cursor:"pointer",padding:12}}>
    <Avatar photo={photo} name={name||"?"} size={80} gender={gender}/>
    <div style={{color:"#007AFF",fontSize:13,fontWeight:500,marginTop:6}}>{photo?"Cambiar foto":"Agregar foto"}</div>
    <input ref={inp} type="file" accept="image/*" onChange={go} style={{display:"none"}}/>
  </div>;
}

/* ── Main App ── */
function getRelation(memberId,rootId,members){
  if(!rootId)return"distant";
  if(memberId===rootId)return"self";
  const byId=Object.fromEntries(members.map(m=>[m.id,m]));
  const root=byId[rootId];if(!root)return"distant";
  // "close": partners, parents, children, siblings — shown fully regardless of core tree
  const partners=parsePartners(root.partnerships).map(p=>p.partnerId);
  if(partners.includes(memberId))return"close";
  const parents=[root.parent1Id,root.parent2Id].filter(Boolean);
  if(parents.includes(memberId))return"close";
  const children=members.filter(m=>m.parent1Id===rootId||m.parent2Id===rootId).map(m=>m.id);
  if(children.includes(memberId))return"close";
  if(parents.length){
    const sibs=members.filter(m=>m.id!==rootId&&parents.some(p=>m.parent1Id===p||m.parent2Id===p)).map(m=>m.id);
    if(sibs.includes(memberId))return"close";
  }
  // "medium" only if member is part of root's direct ancestor/descendant tree (inCoreTree)
  // inCoreTree is set by autoLayout; undefined means not yet computed → treat as in-tree
  const mo=byId[memberId];
  const inCore=!mo||mo.inCoreTree!==false;
  const gps=parents.flatMap(pid=>{const p=byId[pid];return p?[p.parent1Id,p.parent2Id].filter(Boolean):[];});
  if(gps.includes(memberId))return inCore?"medium":"distant";
  const gcs=children.flatMap(cid=>members.filter(m=>m.parent1Id===cid||m.parent2Id===cid).map(m=>m.id));
  if(gcs.includes(memberId))return inCore?"medium":"distant";
  const parentsPartners=parents.flatMap(pid=>{const p=byId[pid];return p?parsePartners(p.partnerships).map(x=>x.partnerId).filter(id=>id!==rootId):[];});
  if(parentsPartners.includes(memberId))return inCore?"medium":"distant";
  const childPartners=children.flatMap(cid=>{const c=byId[cid];return c?parsePartners(c.partnerships).map(x=>x.partnerId):[];});
  if(childPartners.includes(memberId))return inCore?"medium":"distant";
  if(parents.length){
    const sibs=members.filter(m=>m.id!==rootId&&parents.some(p=>m.parent1Id===p||m.parent2Id===p));
    const sibPartners=sibs.flatMap(s=>parsePartners(s.partnerships).map(x=>x.partnerId));
    if(sibPartners.includes(memberId))return inCore?"medium":"distant";
  }
  return"distant";
}

function App(){
  const [members,setMembers]=useState([]);
  const [sel,setSel]=useState(null);
  const [panel,setPanel]=useState(null); // "view"|"edit"|"add"|"partners"
  const [form,setForm]=useState({});
  const [pForm,setPForm]=useState({partnerId:"",type:"actual"});
  const [toast,setToast]=useState(null);
  const [zoom,setZoom]=useState(1);
  const [loading,setLoading]=useState(true);
  const [familyRoot,setFamilyRoot]=useState(()=>localStorage.getItem("familyRoot"));
  const [showRootModal,setShowRootModal]=useState(()=>!localStorage.getItem("familyRoot"));
  const [rootSelect,setRootSelect]=useState(()=>localStorage.getItem("familyRoot")||"");
  const [showPersonas,setShowPersonas]=useState(false);
  const familyRootRef=useRef(localStorage.getItem("familyRoot"));
  const isLocal=useRef(false);
  const autoSaveTimer=useRef(null);
  const canvasRef=useRef(null);

  const flash=msg=>{setToast(msg);setTimeout(()=>setToast(null),2000);};

  // Load from Firebase
  useEffect(()=>{
    dbRef.on("value",snap=>{
      if(isLocal.current){isLocal.current=false;return;}
      const val=snap.val();
      if(!val){setLoading(false);return;}
      const arr=Object.entries(val).map(([k,v])=>({
        ...v,id:v.id||k,
        partnerships:parsePartners(v.partnerships),
        photo:v.photo||null
      }));
      setMembers(autoLayout(arr));
      setLoading(false);
    });
    return ()=>dbRef.off();
  },[]);

  // Auto save
  const doSave=useCallback((data)=>{
    isLocal.current=true;
    saveToDB(data).then(()=>flash("Guardado ✓")).catch(()=>flash("Error al guardar"));
  },[]);

  const update=useCallback(fn=>{
    setMembers(prev=>{
      const next=autoLayout(typeof fn==="function"?fn(prev):fn, familyRootRef.current);
      if(autoSaveTimer.current)clearTimeout(autoSaveTimer.current);
      autoSaveTimer.current=setTimeout(()=>doSave(next),2000);
      return next;
    });
  },[doSave]);

  const saveRoot=id=>{
    localStorage.setItem("familyRoot",id);
    familyRootRef.current=id;
    setFamilyRoot(id);
    setShowRootModal(false);
    setMembers(prev=>autoLayout(prev,id));
  };

  const selM=members.find(m=>m.id===sel);

  // Open panels
  const tapCard=id=>{setSel(id);setPanel("view");};
  const openAdd=()=>{setForm({firstName:"",lastName1:"",lastName2:"",birthDate:"",birthPlace:"",gender:"M",deceased:false,deathDate:"",deathPlace:"",residence:"",phone:"",email:"",facebook:"",instagram:"",parent1Id:"",parent2Id:"",partnerIdNew:"",hijos:[],photo:null});setPanel("add");};
  const openEdit=()=>{if(!selM)return;const hijos=members.filter(m=>m.parent1Id===sel||m.parent2Id===sel).map(m=>m.id);setForm({...selM,partnerIdNew:"",hijos});setPanel("edit");};
  const openPartners=()=>{if(!selM)return;setPForm({partnerId:"",type:"actual"});setPanel("partners");};

  const saveForm=async()=>{
    if(!form.firstName?.trim())return;
    if(panel==="add"&&members.length>0){
      const hasConn=form.parent1Id||form.parent2Id||form.partnerIdNew||parsePartners(form.partnerships).length>0||(form.hijos||[]).length>0;
      if(!hasConn){alert("Conecta a esta persona con alguien del árbol: agrega un padre/madre o una pareja.");return;}
    }
    let photo=form.photo;
    const targetId=panel==="add"?genId():sel;
    if(photo&&photo.startsWith("data:")){
      try{photo=await uploadPhoto(targetId,photo);}catch(e){console.error("upload error",e);}
    }
    const fdata={...form,photo};
    if(panel==="add"){
      const ps=fdata.partnerIdNew?[{partnerId:fdata.partnerIdNew,type:"actual"}]:[];
      const n={...fdata,id:targetId,partnerships:ps};
      update(p=>{
        const next=[...p,n];
        if(!fdata.partnerIdNew)return next;
        return next.map(m=>m.id===fdata.partnerIdNew&&!m.partnerships.find(x=>x.partnerId===targetId)?{...m,partnerships:[...m.partnerships,{partnerId:targetId,type:"actual"}]}:m);
      });
    } else {
      update(p=>p.map(m=>{
        if(m.id===sel){
          const updated={...m,...fdata};
          if(fdata.partnerIdNew&&!updated.partnerships.find(x=>x.partnerId===fdata.partnerIdNew))
            updated.partnerships=[...updated.partnerships,{partnerId:fdata.partnerIdNew,type:"actual"}];
          return updated;
        }
        if(fdata.partnerIdNew&&m.id===fdata.partnerIdNew&&!m.partnerships.find(x=>x.partnerId===sel))
          return{...m,partnerships:[...m.partnerships,{partnerId:sel,type:"actual"}]};
        return m;
      }));
    }
    // Link children: set parent1Id or parent2Id on each selected child
    const newHijos=fdata.hijos||[];
    newHijos.forEach(hijoId=>{
      const hijo=members.find(m=>m.id===hijoId);if(!hijo)return;
      if(!hijo.parent1Id||hijo.parent1Id===targetId)
        dbRef.child(hijoId).update({parent1Id:targetId});
      else if(!hijo.parent2Id||hijo.parent2Id===targetId)
        dbRef.child(hijoId).update({parent2Id:targetId});
    });
    // Clear parentId for children removed from the list
    if(panel==="edit"){
      const prevHijos=members.filter(m=>m.parent1Id===targetId||m.parent2Id===targetId).map(m=>m.id);
      prevHijos.filter(id=>!newHijos.includes(id)).forEach(hijoId=>{
        const hijo=members.find(m=>m.id===hijoId);if(!hijo)return;
        const upd={};
        if(hijo.parent1Id===targetId)upd.parent1Id=null;
        if(hijo.parent2Id===targetId)upd.parent2Id=null;
        if(Object.keys(upd).length)dbRef.child(hijoId).update(upd);
      });
    }
    setPanel(null);
  };

  const addPartner=()=>{
    if(!sel||!pForm.partnerId)return;
    update(p=>p.map(m=>{
      if(m.id===sel){const ps=[...m.partnerships];if(!ps.find(x=>x.partnerId===pForm.partnerId))ps.push({partnerId:pForm.partnerId,type:pForm.type});return{...m,partnerships:ps};}
      if(m.id===pForm.partnerId){const ps=[...m.partnerships];if(!ps.find(x=>x.partnerId===sel))ps.push({partnerId:sel,type:pForm.type});return{...m,partnerships:ps};}
      return m;
    }));
    setPForm({partnerId:"",type:"actual"});
  };

  const removePartner=pid=>{
    update(p=>p.map(m=>{
      if(m.id===sel)return{...m,partnerships:m.partnerships.filter(x=>x.partnerId!==pid)};
      if(m.id===pid)return{...m,partnerships:m.partnerships.filter(x=>x.partnerId!==sel)};
      return m;
    }));
  };

  const removePerson=()=>{
    if(!sel||!confirm("¿Eliminar a esta persona?"))return;
    // Clean all references to sel in Firebase before deleting
    members.forEach(m=>{
      if(m.id===sel)return;
      const upd={};
      if(m.parent1Id===sel)upd.parent1Id=null;
      if(m.parent2Id===sel)upd.parent2Id=null;
      const newPs=m.partnerships.filter(x=>x.partnerId!==sel);
      if(newPs.length!==m.partnerships.length)upd.partnerships=newPs.length?newPs:null;
      if(Object.keys(upd).length)dbRef.child(m.id).update(upd);
    });
    isLocal.current=true;
    dbRef.child(sel).remove();
    update(p=>p.filter(m=>m.id!==sel).map(m=>({...m,
      parent1Id:m.parent1Id===sel?null:m.parent1Id,
      parent2Id:m.parent2Id===sel?null:m.parent2Id,
      partnerships:m.partnerships.filter(x=>x.partnerId!==sel)})));
    setSel(null);setPanel(null);
  };

  const manualSave=()=>{
    isLocal.current=true;
    saveToDB(members).then(()=>flash("Guardado ✓")).catch(()=>flash("Error"));
  };

  // SVG dimensions
  const allX=members.map(m=>m.x);
  const allY=members.map(m=>m.y);
  const svgW=members.length?Math.max(...allX)+200:800;
  const svgH=members.length?Math.max(...allY)+200:600;

  const fit=()=>{if(!members.length)return;const xs=members.map(m=>m.x);const ys=members.map(m=>m.y);const tw=Math.max(...xs)-Math.min(...xs)+300;const th=Math.max(...ys)-Math.min(...ys)+300;const vw=window.innerWidth;const vh=window.innerHeight-60;setZoom(Math.min(vw/tw,vh/th,1));};
  useEffect(()=>{if(members.length>0){const xs=members.map(m=>m.x);const ys=members.map(m=>m.y);const tw=Math.max(...xs)-Math.min(...xs)+300;const th=Math.max(...ys)-Math.min(...ys)+300;const vw=window.innerWidth;const vh=window.innerHeight-60;setZoom(Math.min(vw/tw,vh/th,1));}},[members.length]);
  useEffect(()=>{
    if(!familyRoot||!members.length||!canvasRef.current)return;
    const rm=members.find(m=>m.id===familyRoot);if(!rm)return;
    const vw=window.innerWidth;const vh=window.innerHeight-60;
    canvasRef.current.scrollTo({left:Math.max(0,rm.x*zoom-vw/2),top:Math.max(0,rm.y*zoom-vh/2)});
  },[familyRoot,members.length]);

  if(loading)return <div style={{width:"100%",height:"100vh",background:"#F2F2F7",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:12}}>
    <span style={{fontSize:48}}>🌳</span><span style={{color:"rgba(60,60,67,0.6)",fontSize:16}}>Cargando…</span></div>;

  const relMap=Object.fromEntries(members.map(m=>[m.id,getRelation(m.id,familyRoot,members)]));

  const sheet=(title,onClose,content)=><>
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.3)",zIndex:50}}/>
    <div style={{position:"fixed",bottom:0,left:0,right:0,zIndex:60,background:"#F2F2F7",borderRadius:"14px 14px 0 0",maxHeight:"90vh",overflowY:"auto",paddingBottom:"env(safe-area-inset-bottom,20px)",animation:"sheetUp .3s ease-out"}}>
      <div style={{display:"flex",justifyContent:"center",padding:"10px 0 2px"}}><div style={{width:36,height:5,borderRadius:3,background:"rgba(60,60,67,0.15)"}}/></div>
      <div style={{display:"flex",justifyContent:"space-between",padding:"6px 20px 10px"}}>
        <button onClick={onClose} style={{background:"none",border:"none",color:"#007AFF",fontSize:17,cursor:"pointer"}}>Cerrar</button>
        <span style={{fontSize:17,fontWeight:600}}>{title}</span>
        <div style={{width:50}}/>
      </div>
      <div style={{padding:"0 20px 24px"}}>{content}</div>
    </div>
  </>;

  const close=()=>setPanel(null);

  return <div style={{width:"100%",height:"100vh",background:"#F2F2F7",display:"flex",flexDirection:"column",overflow:"hidden"}}>
    {toast&&<div style={{position:"fixed",top:16,left:"50%",transform:"translateX(-50%)",zIndex:200,background:"rgba(0,0,0,.75)",color:"#fff",padding:"10px 24px",borderRadius:100,fontSize:14,fontWeight:500,animation:"fadeIn .25s ease"}}>{toast}</div>}

    {/* Header */}
    <div style={{borderBottom:"0.5px solid rgba(60,60,67,0.12)",background:"rgba(249,249,249,0.9)",backdropFilter:"blur(20px)",WebkitBackdropFilter:"blur(20px)",zIndex:10}}>
      <div style={{padding:"8px 16px 2px",display:"flex",alignItems:"center",gap:6}}>
        <span style={{fontSize:16,fontWeight:700}}>Mi Familia</span>
        <span style={{fontSize:12,color:"rgba(60,60,67,0.6)"}}>{members.length}</span>
      </div>
      <div style={{display:"flex",gap:6,padding:"4px 16px 8px",overflowX:"auto",scrollbarWidth:"none",msOverflowStyle:"none",WebkitOverflowScrolling:"touch"}}>
        <style>{"._hbar::-webkit-scrollbar{display:none}"}</style>
        {[
          {label:"+",onClick:()=>setZoom(z=>Math.min(z+0.15,2.5)),bg:"rgba(120,120,128,0.12)"},
          {label:"−",onClick:()=>setZoom(z=>Math.max(z-0.15,0.2)),bg:"rgba(120,120,128,0.12)"},
          {label:"Ajustar",onClick:fit,bg:"rgba(120,120,128,0.12)"},
          {label:"👥 Personas",onClick:()=>setShowPersonas(true),bg:"rgba(120,120,128,0.12)"},
          {label:"Guardar",onClick:manualSave,bg:"#34C759",color:"#fff"},
          {label:"Agregar",onClick:openAdd,bg:"#007AFF",color:"#fff"},
          ...(sel?[
            {label:"Editar",onClick:openEdit,bg:"#007AFF",color:"#fff"},
            {label:"Eliminar",onClick:removePerson,bg:"#FF3B30",color:"#fff"},
          ]:[]),
        ].map(({label,onClick,bg,color})=>(
          <button key={label} onClick={onClick} style={{flexShrink:0,padding:"5px 10px",borderRadius:100,border:"none",background:bg,color:color||"inherit",fontSize:11,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap"}}>{label}</button>
        ))}
      </div>
    </div>

    <style>{members.map(m=>{const op=relMap[m.id]==="medium"?0.6:relMap[m.id]==="distant"?0.2:1;return`.pn-${m.id}{opacity:${op}!important}`;}).join("")}</style>
    {/* Canvas */}
    <div ref={canvasRef} style={{flex:1,overflow:"auto",background:"#F2F2F7"}}>
      <svg width={svgW*zoom} height={svgH*zoom} style={{display:"block"}}>
        <g transform={`scale(${zoom})`}>
          <TreeLines members={members} relations={relMap}/>
          {members.map(m=><PersonNode key={m.id} m={m} onTap={tapCard} relation={relMap[m.id]||"distant"}/>)}
        </g>
      </svg>
    </div>

    {/* View profile */}
    {panel==="view"&&selM&&sheet(getDisplay(selM).full,close,<div style={{display:"flex",flexDirection:"column",gap:8}}>
      <div style={{textAlign:"center",padding:8}}>
        <Avatar photo={selM.photo} name={getDisplay(selM).full} size={100} gender={selM.gender} deceased={selM.deceased}/>
        <div style={{fontSize:20,fontWeight:700,marginTop:8}}>{selM.deceased?"† ":""}{getDisplay(selM).full}</div>
        {calcAge(selM.birthDate,selM.deceased?selM.deathDate:null)!==null&&<div style={{color:"#888",fontSize:14}}>{calcAge(selM.birthDate,selM.deceased?selM.deathDate:null)} años</div>}
      </div>
      <div style={{background:"#fff",borderRadius:12,overflow:"hidden"}}>
        {selM.birthDate&&<div style={{padding:"10px 14px",borderBottom:"0.5px solid rgba(60,60,67,0.12)"}}><span style={{color:"#888",fontSize:12}}>Nacimiento</span><div>{selM.birthDate}{selM.birthPlace?` · ${selM.birthPlace}`:""}</div></div>}
        {selM.residence&&<div style={{padding:"10px 14px",borderBottom:"0.5px solid rgba(60,60,67,0.12)"}}><span style={{color:"#888",fontSize:12}}>Residencia</span><div>{selM.residence}</div></div>}
        {selM.deceased&&<div style={{padding:"10px 14px"}}><span style={{color:"#888",fontSize:12}}>Fallecimiento</span><div>{selM.deathDate||""}{selM.deathPlace?` · Restos: ${selM.deathPlace}`:""}</div></div>}
      </div>
      {(()=>{const pars=[selM.parent1Id,selM.parent2Id].filter(Boolean).map(id=>members.find(m=>m.id===id)).filter(Boolean);return pars.length>0&&<div style={{background:"#fff",borderRadius:12,overflow:"hidden"}}>{pars.map((p,i)=><div key={p.id} style={{padding:"10px 14px",display:"flex",alignItems:"center",gap:10,borderBottom:i<pars.length-1?"0.5px solid rgba(60,60,67,0.12)":"none"}}><Avatar photo={p.photo} name={getDisplay(p).full} size={40} gender={p.gender}/><div style={{flex:1}}><div style={{fontWeight:600,fontSize:15}}>{getDisplay(p).full}</div><div style={{fontSize:12,color:"#888"}}>{p.gender==="F"?"Madre":"Padre"}</div></div></div>)}</div>;})()}
      {parsePartners(selM.partnerships).filter(pr=>members.find(m=>m.id===pr.partnerId)).length>0&&
        <div style={{background:"#fff",borderRadius:12,overflow:"hidden"}}>
          {parsePartners(selM.partnerships).map((pr,i,arr)=>{
            const p=members.find(m=>m.id===pr.partnerId);if(!p)return null;
            return <div key={pr.partnerId} style={{padding:"10px 14px",display:"flex",alignItems:"center",gap:10,borderBottom:i<arr.length-1?"0.5px solid rgba(60,60,67,0.12)":"none"}}>
              <Avatar photo={p.photo} name={getDisplay(p).full} size={40} gender={p.gender}/>
              <div style={{flex:1}}>
                <div style={{fontWeight:600,fontSize:15}}>{getDisplay(p).full}</div>
                <div style={{fontSize:12,color:pr.type==="actual"?"#34C759":"#888"}}>{pr.type==="actual"?"Pareja actual":"Ex pareja"}</div>
              </div>
            </div>;
          })}
        </div>
      }
      {(selM.phone||selM.email||selM.facebook||selM.instagram)&&<div style={{display:"flex",justifyContent:"center",gap:12,padding:8}}>
        {selM.phone&&<a href={`tel:${selM.phone}`} style={{width:44,height:44,borderRadius:22,background:"#34C759",display:"flex",alignItems:"center",justifyContent:"center"}}>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.07 13a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3 2.18h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </a>}
        {selM.email&&<a href={`mailto:${selM.email}`} style={{width:44,height:44,borderRadius:22,background:"#007AFF",display:"flex",alignItems:"center",justifyContent:"center"}}>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
        </a>}
        {selM.facebook&&<a href={selM.facebook.startsWith("http")?selM.facebook:`https://facebook.com/${selM.facebook}`} target="_blank" style={{width:44,height:44,borderRadius:22,background:"#1877F2",display:"flex",alignItems:"center",justifyContent:"center"}}>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M24 12.073C24 5.404 18.627 0 12 0S0 5.404 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.41c0-3.025 1.792-4.697 4.533-4.697 1.312 0 2.686.235 2.686.235v2.97h-1.514c-1.491 0-1.956.93-1.956 1.886v2.268h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/></svg>
        </a>}
        {selM.instagram&&<a href={selM.instagram.startsWith("http")?selM.instagram:`https://instagram.com/${selM.instagram}`} target="_blank" style={{width:44,height:44,borderRadius:22,background:"linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)",display:"flex",alignItems:"center",justifyContent:"center"}}>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/></svg>
        </a>}
      </div>}
      <div style={{display:"flex",gap:8,padding:"8px 0"}}>
        <button onClick={openEdit} style={{flex:1,padding:"12px 0",background:"#007AFF",border:"none",borderRadius:12,color:"#fff",fontSize:16,fontWeight:600,cursor:"pointer"}}>Editar</button>
        <button onClick={removePerson} style={{padding:"12px 16px",background:"#FF3B30",border:"none",borderRadius:12,color:"#fff",fontSize:16,fontWeight:600,cursor:"pointer"}}>Eliminar</button>
      </div>
    </div>)}

    {/* Add/Edit form */}
    {(panel==="add"||panel==="edit")&&sheet(panel==="add"?"Agregar":"Editar",close,<div>
      <PhotoUpload photo={form.photo} gender={form.gender} name={form.firstName} onUp={d=>setForm({...form,photo:d})}/>
      <Toggle value={form.gender==="F"} onChange={v=>setForm({...form,gender:v?"F":"M"})} labelA="Masculino" labelB="Femenino"/>
      <SecTitle>Nombre</SecTitle>
      <Inp value={form.firstName} onChange={e=>setForm({...form,firstName:e.target.value})} placeholder="Nombre(s)"/>
      <Inp value={form.lastName1} onChange={e=>setForm({...form,lastName1:e.target.value})} placeholder="Apellido paterno"/>
      <Inp value={form.lastName2} onChange={e=>setForm({...form,lastName2:e.target.value})} placeholder="Apellido materno"/>
      <SecTitle>Nacimiento</SecTitle>
      <Inp type="date" value={form.birthDate} onChange={e=>setForm({...form,birthDate:e.target.value})}/>
      <Inp value={form.birthPlace} onChange={e=>setForm({...form,birthPlace:e.target.value})} placeholder="Lugar de nacimiento"/>
      <SecTitle>Residencia</SecTitle>
      <Inp value={form.residence} onChange={e=>setForm({...form,residence:e.target.value})} placeholder="Lugar de residencia actual"/>
      <SecTitle>Contacto</SecTitle>
      <Inp type="tel" value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} placeholder="Teléfono"/>
      <Inp type="email" value={form.email} onChange={e=>setForm({...form,email:e.target.value})} placeholder="Correo electrónico"/>
      <Inp value={form.facebook} onChange={e=>setForm({...form,facebook:e.target.value})} placeholder="Facebook (URL o usuario)"/>
      <Inp value={form.instagram} onChange={e=>setForm({...form,instagram:e.target.value})} placeholder="Instagram (URL o usuario)"/>
      <Toggle value={form.deceased||false} onChange={v=>setForm({...form,deceased:v})} labelA="Vivo/a" labelB="Fallecido/a"/>
      {form.deceased&&<><SecTitle>Fallecimiento</SecTitle>
        <Inp type="date" value={form.deathDate} onChange={e=>setForm({...form,deathDate:e.target.value})}/>
        <Inp value={form.deathPlace} onChange={e=>setForm({...form,deathPlace:e.target.value})} placeholder="Lugar donde descansan sus restos"/>
      </>}
      <SecTitle>Padres</SecTitle>
      <Sel value={form.parent1Id} onChange={e=>setForm({...form,parent1Id:e.target.value})}>
        <option value="">Padre/Madre 1 — Ninguno</option>
        {members.filter(m=>m.id!==sel&&(!form.birthDate||!m.birthDate||m.birthDate<form.birthDate||m.deceased)).map(m=><option key={m.id} value={m.id}>{getDisplay(m).full}</option>)}
      </Sel>
      <Sel value={form.parent2Id} onChange={e=>setForm({...form,parent2Id:e.target.value})}>
        <option value="">Padre/Madre 2 — Ninguno</option>
        {members.filter(m=>m.id!==sel&&m.id!==form.parent1Id&&(!form.birthDate||!m.birthDate||m.birthDate<form.birthDate||m.deceased)).map(m=><option key={m.id} value={m.id}>{getDisplay(m).full}</option>)}
      </Sel>
      <SecTitle>Pareja</SecTitle>
      <Sel value={form.partnerIdNew||""} onChange={e=>setForm({...form,partnerIdNew:e.target.value})}>
        <option value="">— Ninguno —</option>
        {members.filter(m=>{
          if(m.id===sel)return false;
          const actual=parsePartners(m.partnerships).find(x=>x.type==="actual");
          if(actual&&actual.partnerId!==sel)return false;
          if(m.birthDate){const age=calcAge(m.birthDate,null);if(age!==null&&age<18)return false;}
          return true;
        }).map(m=><option key={m.id} value={m.id}>{getDisplay(m).full}</option>)}
      </Sel>
      <SecTitle>Hijos</SecTitle>
      {(form.hijos||[]).length>0&&<div style={{display:"flex",flexWrap:"wrap",gap:6,padding:"0 14px 8px"}}>{(form.hijos||[]).map(id=>{const p=members.find(m=>m.id===id);if(!p)return null;return <div key={id} style={{display:"flex",alignItems:"center",gap:4,background:"rgba(120,120,128,0.12)",borderRadius:100,padding:"4px 10px",fontSize:13}}><span>{getDisplay(p).full}</span><span onClick={()=>setForm({...form,hijos:(form.hijos||[]).filter(x=>x!==id)})} style={{cursor:"pointer",color:"#FF3B30",fontWeight:700,marginLeft:2}}>×</span></div>;})}</div>}
      <Sel value="" onChange={e=>{const id=e.target.value;if(id)setForm({...form,hijos:[...(form.hijos||[]),id]});}}>
        <option value="">— Agregar hijo/a —</option>
        {members.filter(m=>{
          if(m.id===sel)return false;
          if((form.hijos||[]).includes(m.id))return false;
          if(form.birthDate&&m.birthDate){const diff=calcAge(m.birthDate,null);const pAge=calcAge(form.birthDate,null);if(diff!==null&&pAge!==null&&pAge-diff<18)return false;}
          return true;
        }).map(m=><option key={m.id} value={m.id}>{getDisplay(m).full}</option>)}
      </Sel>
      <button onClick={saveForm} style={{width:"100%",marginTop:16,padding:"14px 0",background:"#007AFF",border:"none",borderRadius:12,color:"#fff",fontSize:17,fontWeight:600,cursor:"pointer"}}>
        {panel==="add"?"Agregar":"Guardar cambios"}
      </button>
    </div>)}

    {/* Partners */}
    {panel==="partners"&&selM&&sheet("Parejas de "+getDisplay(selM).first,close,<div style={{display:"flex",flexDirection:"column",gap:12}}>
      {selM.partnerships.map(pr=>{const p=members.find(m=>m.id===pr.partnerId);if(!p)return null;
        return <div key={pr.partnerId} style={{background:"#fff",borderRadius:12,padding:"10px 14px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <Avatar photo={p.photo} name={getDisplay(p).full} size={40} gender={p.gender}/>
            <div><div style={{fontWeight:600}}>{getDisplay(p).full}</div><div style={{fontSize:12,color:pr.type==="actual"?"#34C759":"#888"}}>{pr.type==="actual"?"Pareja actual":"Ex pareja"}</div></div>
          </div>
          <button onClick={()=>removePartner(pr.partnerId)} style={{width:28,height:28,borderRadius:14,background:"rgba(120,120,128,0.12)",border:"none",color:"#FF3B30",fontSize:16,fontWeight:700,cursor:"pointer"}}>×</button>
        </div>;})}
      <SecTitle>Agregar pareja</SecTitle>
      <Sel value={pForm.partnerId} onChange={e=>setPForm({...pForm,partnerId:e.target.value})}>
        <option value="">Seleccionar persona…</option>
        {members.filter(m=>m.id!==sel&&!selM.partnerships.find(x=>x.partnerId===m.id)).map(m=><option key={m.id} value={m.id}>{getDisplay(m).full}</option>)}
      </Sel>
      <Sel value={pForm.type} onChange={e=>setPForm({...pForm,type:e.target.value})}>
        <option value="actual">Pareja actual</option>
        <option value="anterior">Ex pareja</option>
      </Sel>
      <button onClick={addPartner} disabled={!pForm.partnerId} style={{width:"100%",padding:"12px 0",background:pForm.partnerId?"#007AFF":"rgba(120,120,128,0.12)",border:"none",borderRadius:12,color:pForm.partnerId?"#fff":"#999",fontSize:16,fontWeight:600,cursor:pForm.partnerId?"pointer":"default"}}>Agregar pareja</button>
    </div>)}

    {/* Personas drawer */}
    {showPersonas&&<>
      <div onClick={()=>setShowPersonas(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.3)",zIndex:70}}/>
      <div style={{position:"fixed",top:0,right:0,bottom:0,width:"min(320px,85vw)",zIndex:80,background:"#F2F2F7",animation:"slideInRight .28s ease-out",display:"flex",flexDirection:"column",paddingBottom:"env(safe-area-inset-bottom,20px)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 16px 10px",borderBottom:"0.5px solid rgba(60,60,67,0.12)",background:"rgba(249,249,249,0.95)",backdropFilter:"blur(20px)",WebkitBackdropFilter:"blur(20px)"}}>
          <span style={{fontSize:17,fontWeight:600}}>Personas</span>
          <button onClick={()=>setShowPersonas(false)} style={{background:"none",border:"none",color:"#007AFF",fontSize:17,cursor:"pointer"}}>Cerrar</button>
        </div>
        <div style={{overflowY:"auto",flex:1}}>
          {[...members].sort((a,b)=>getDisplay(a).full.localeCompare(getDisplay(b).full)).map(m=>{
            const d=getDisplay(m);
            const age=calcAge(m.birthDate,m.deceased?m.deathDate:null);
            return <div key={m.id} onClick={()=>{
              setShowPersonas(false);
              saveRoot(m.id);
              setTimeout(()=>{
                if(!canvasRef.current)return;
                const rm=members.find(x=>x.id===m.id);if(!rm)return;
                const vw=window.innerWidth,vh=window.innerHeight-60;
                canvasRef.current.scrollTo({left:Math.max(0,rm.x*zoom-vw/2),top:Math.max(0,rm.y*zoom-vh/2),behavior:"smooth"});
              },80);
            }} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 16px",borderBottom:"0.5px solid rgba(60,60,67,0.07)",cursor:"pointer",background:familyRoot===m.id?"rgba(0,122,255,0.08)":"transparent"}}>
              <Avatar photo={m.photo} name={d.full} size={40} gender={m.gender} deceased={m.deceased}/>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:15,fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{d.full}</div>
                <div style={{fontSize:12,color:"#888"}}>{age!==null?`${age} años · `:""}{m.deceased?"🕊️":"💚"}</div>
              </div>
            </div>;
          })}
        </div>
      </div>
    </>}

    {/* Root person chip */}
    {familyRoot&&(()=>{const rm=members.find(m=>m.id===familyRoot);if(!rm)return null;return <div onClick={()=>{setRootSelect(familyRoot);setShowRootModal(true);}} style={{position:"fixed",bottom:20,right:20,zIndex:50,background:"#fff",borderRadius:100,padding:"6px 12px 6px 6px",display:"flex",alignItems:"center",gap:8,boxShadow:"0 2px 12px rgba(0,0,0,0.18)",cursor:"pointer"}}><Avatar photo={rm.photo} name={getDisplay(rm).full} size={32} gender={rm.gender}/><span style={{fontSize:13,fontWeight:600}}>{getDisplay(rm).first}</span></div>;})()}

    {/* Who are you modal */}
    {showRootModal&&members.length>0&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:"#F2F2F7",borderRadius:20,padding:24,width:"min(340px,100%)",display:"flex",flexDirection:"column",gap:16}}>
        <div style={{fontSize:20,fontWeight:700,textAlign:"center"}}>¿Quién eres?</div>
        <Sel value={rootSelect} onChange={e=>setRootSelect(e.target.value)}>
          <option value="">Selecciona tu nombre...</option>
          {[...members].sort((a,b)=>getDisplay(a).full.localeCompare(getDisplay(b).full)).map(m=><option key={m.id} value={m.id}>{getDisplay(m).full}</option>)}
        </Sel>
        <button onClick={()=>{if(rootSelect)saveRoot(rootSelect);}} disabled={!rootSelect} style={{padding:"14px 0",background:rootSelect?"#007AFF":"rgba(120,120,128,0.12)",border:"none",borderRadius:12,color:rootSelect?"#fff":"#999",fontSize:17,fontWeight:600,cursor:rootSelect?"pointer":"default"}}>Continuar</button>
        {familyRoot&&<button onClick={()=>setShowRootModal(false)} style={{padding:"10px 0",background:"none",border:"none",color:"#007AFF",fontSize:15,cursor:"pointer"}}>Cancelar</button>}
      </div>
    </div>}
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
